const labNames=[['fishbein','Fishbein calculator'],['balance','Balance triad'],['elm','ELM router'],['influence','Cialdini’s six'],['repetition','Repetition curve'],['rules','Decision rules'],['context','Framing & nudges']];
function labs(){return `<div class="eyebrow">LEARN BY EXPLORING</div><h1 style="margin-bottom:12px">Make the invisible visible.</h1><p class="muted">Change a weight, flip a sign, pick a rule, and watch the outcome change. These models illustrate textbook concepts; they are not empirical predictions.</p><div class="tabs" aria-label="Choose a visual lab">${labNames.map(([id,label])=>`<button class="${lab===id?'active':''}" aria-pressed="${lab===id}" onclick="lab='${id}';render()">${label}</button>`).join('')}</div><div class="lab-stage">${labContent()}</div>`}
const fbAttrs=[['All women',7,[9,3,3,3]],['Academic reputation',6,[8,9,6,3]],['Library facilities',5,[7,9,7,2]],['Cost',4,[2,2,6,9]],['Proximity to home',3,[2,2,6,9]],['Social atmosphere',2,[1,3,7,9]],['Athletics',1,[1,2,5,1]]];const fbSchools=['Warren','Ivy','State','Northland'];
const triadLinks=[['Chris → Dan','pd'],['Chris → Earring','pe'],['Dan → Earring','de']];let triad={pd:1,pe:-1,de:1};
const elmCues=[['args','Strong product arguments','Detailed specs, test results, data'],['model','Attractive model','A good-looking person using the product'],['celeb','Celebrity endorser','A famous face says it’s great'],['pack','Package & visuals','Colors, design, the “sexy” package'],['story','A story','A narrative with a character and plot']];let elm={inv:'low',prod:'shampoo',cue:null};
const influence={reciprocity:['Reciprocity','People feel obliged to give back what they received first.','Restaurant mints: 1 mint → ~3% more tips; 2 mints → ~14%; 1 mint + turning back “for you nice people” → ~23%.','Give first; make it personalized and unexpected.',23],scarcity:['Scarcity','People want more of what they can have less of.','British Airways announced in 2003 it would end the Concorde London–NY flights; sales took off the next day.','Point out what’s unique and what they stand to lose.',null],authority:['Authority','People follow credible, knowledgeable experts.','Real estate receptionists mentioning colleagues’ experience → +20% appointments, +15% signed contracts.','Signal credibility before the request; let someone else introduce you.',20],consistency:['Consistency','People like to be consistent with what they previously said or did.','A small “Drive Safely” window card 10 days earlier → 4× (400%) more agreed to a big lawn sign. Patients writing their own appointment cards → 18% fewer no-shows.','Ask for small voluntary, active, public commitments, ideally in writing.',18],liking:['Liking','We say yes to people we like: similar, complimentary, cooperative.','MBA negotiations: “get straight to business” ~55% agreed; “find a similarity first” ~90% agreed, deals worth ~18% more.','Find genuine similarities and give genuine compliments before business.',90],consensus:['Consensus','When uncertain, people look to the actions of others.','Hotel towels: environmental message ~35% compliance; “75% of guests reuse” +26%; “75% who stayed in this room” +33%.','Point to what many similar others are already doing.',33]};
const ratings={E:3,G:2,P:1};const rAttrs=[['Powerful processor (CPU)',1],['Video graphics card',1],['Memory (RAM)',2],['Brand reputation',3],['Cooling',4],['Additional motherboard slots',6],['Appearance and lighting',6]];const rBrands=['Optimus','Syop','Babylon'];const rTable=[['E','E','G'],['E','G','E'],['G','G','G'],['E','E','P'],['E','G','P'],['G','G','E'],['E','P','E']];let rule='lexi',ebaAttr=5,conjCut='G';
const contextScen={sunk:['Sunk-cost fallacy','Free ticket','Paid a fortune','A snowstorm makes driving to the game dangerous.','With a free ticket, most people stay home. Nothing is “lost.”','With a paid ticket, people are more likely to risk the storm so they don’t “waste” the money, even though the danger is identical. That’s the sunk-cost fallacy, driven by loss aversion.'],frame:['Gain vs. loss framing','Gain frame','Loss frame','The same outcome, described two ways.','Framed as a gain (“save 200 of 600 jobs”), people tend to be risk averse and take the sure thing.','Framed as a loss (“400 of 600 jobs will be lost”), people tend to be risk seeking and gamble to avoid the loss. Prospect theory: losses loom larger than gains.'],default:['Default bias (nudge)','Opt-in','Opt-out','A retirement savings plan at work.','When employees must sign up themselves (opt in), many never do.','When enrollment is automatic and people must opt out, participation rises dramatically. People stick with defaults. That’s a nudge using choice architecture.'],decoy:['Decoy option','Two options','Add a decoy','Small coffee $3, large $5.','With two options, many people choose the cheaper small coffee.','Add a medium at $4.75 (inferior to the large). The large now looks like a bargain, and more people upscale. The medium is a decoy.'],mental:['Mental accounting','$1,000 paycheck','$1,000 inheritance','Same amount of money, different source.','Earned paycheck money is budgeted and partly saved.','Windfall money gets treated as “fun money” and spent fast (dinner for 20 friends). Same dollars, different mental account.'],temporal:['Temporal framing','“Start of September Sale”','“End of August Sale”','Where should the featured product go on the flyer?','“Start of …” shifts attention to the LEFT, so put the featured product on the left.','“End of …” shifts attention to the RIGHT. Shoppers found the margarine faster when it sat on the right.']};let ctx={id:'sunk',side:0};
function labContent(){
if(lab==='fishbein')return `<span class="badge">LAB 01 · LESSON 6.1</span><h2 style="margin-top:12px">Change what matters, change the winner.</h2><p class="muted small">Table 6.1 beliefs are fixed. Drag Alex’s importance weights and watch each school’s attitude score (Σ belief × importance). Defaults match the textbook.</p><div class="lab-grid"><div>${fbAttrs.map(([a,w],i)=>`<label class="label" for="fb${i}">${a}: <span id="fbv${i}">${w}</span></label><input id="fb${i}" type="range" min="0" max="7" value="${w}" oninput="updateFishbein()">`).join('')}<button class="linkbtn" style="margin-top:14px;font-size:12px" onclick="fbAttrs.forEach(([a,w],i)=>document.getElementById('fb'+i).value=w);updateFishbein()">Reset to textbook weights</button></div><div class="lab-panel"><div class="eyebrow">ATTITUDE SCORES</div><div id="fbBars" class="score-bars"></div><div class="output" id="fbOut" aria-live="polite"></div><div class="callout"><strong>Northland’s move</strong>Raise “Social atmosphere” or “Cost” to see <b>capitalizing on relative advantage</b>: convince Alex that the attribute Northland wins on matters more.</div></div></div>`;
if(lab==='balance')return `<span class="badge">LAB 02 · LESSON 6.2</span><h2 style="margin-top:12px">Is the triad balanced?</h2><p class="muted small">Click each link to flip it between like (+) and dislike (−). Multiply the three signs: positive = balanced, negative = unbalanced.</p><div class="lab-grid"><div id="triadSvg"></div><div class="lab-panel"><div class="choice-grid" style="grid-template-columns:1fr">${triadLinks.map(([t,k])=>`<button class="choice-tile" style="min-height:auto" onclick="triad.${k}*=-1;drawTriad()"><b>${t}</b><span id="tl${k}"></span></button>`).join('')}</div><div class="output" id="triadOut" aria-live="polite"></div></div></div>`;
if(lab==='elm')return `<span class="badge">LAB 03 · LESSONS 6.3 + 6.5</span><h2 style="margin-top:12px">Steak or sizzle?</h2><p class="muted small">Set the viewer’s involvement and the product, then pick a cue to see which route it travels and how much it matters.</p><div class="tabs"><button class="${elm.inv==='low'?'active':''}" onclick="elm.inv='low';render()">Low involvement</button><button class="${elm.inv==='high'?'active':''}" onclick="elm.inv='high';render()">High involvement</button><span style="width:20px"></span><button class="${elm.prod==='shampoo'?'active':''}" onclick="elm.prod='shampoo';render()">Shampoo ad</button><button class="${elm.prod==='car'?'active':''}" onclick="elm.prod='car';render()">Car ad</button></div><div class="lab-grid"><div class="choice-grid">${elmCues.map(([id,t,s])=>`<button class="choice-tile ${elm.cue===id?'active':''}" onclick="elm.cue='${id}';render()"><b>${t}</b><span>${s}</span></button>`).join('')}</div><div class="lab-panel"><div class="eyebrow">ROUTE: ${elm.inv==='high'?'CENTRAL (SYSTEM 2)':'PERIPHERAL (SYSTEM 1)'}</div><div class="output" aria-live="polite">${elmResult()}</div></div></div>`;
if(lab==='influence')return `<span class="badge">LAB 04 · CIALDINI VIDEO</span><h2 style="margin-top:12px">Six shortcuts to “yes.”</h2><p class="muted small">Select a principle to see its definition, the study from the video, and how to use it ethically.</p><div class="lab-grid"><div class="choice-grid">${Object.entries(influence).map(([k,v],i)=>`<button class="choice-tile" onclick="showInfluence('${k}')"><span class="badge">0${i+1}</span><b style="margin-top:8px">${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div><div class="lab-panel"><div id="infOut" aria-live="polite"><h3>Mnemonic: “RS-ACLC”</h3><p class="small"><b>R</b>eciprocity · <b>S</b>carcity · <b>A</b>uthority · <b>C</b>onsistency · <b>L</b>iking · <b>C</b>onsensus. Or: “Really Smart Authors Can Lead Crowds.”</p></div></div></div>`;
if(lab==='repetition')return `<span class="badge">LAB 05 · LESSON 6.4</span><h2 style="margin-top:12px">When does repetition start to hurt?</h2><p class="muted small">Two-factor theory: familiarity (learning) rises, boredom (tedium) grows. Slide the exposure count. Curves are illustrative, not measured data.</p><div class="lab-grid"><div id="repSvg"></div><div class="lab-panel"><label class="label" for="repN">Number of exposures: <span id="repV">3</span></label><input id="repN" type="range" min="1" max="12" value="3" oninput="drawRep()"><div class="output" id="repOut" aria-live="polite"></div><p class="small muted" style="margin-top:14px">Fight wear-out: shorter formats, spacing between exposures, and variations on a theme. Transporting ads with mental stimulation can go past three.</p></div></div>`;
if(lab==='rules')return `<span class="badge">LAB 06 · LESSON 7.2</span><h2 style="margin-top:12px">Same data, different rule, different winner.</h2><p class="muted small">Table 7.1: Chan’s gaming PCs. Pick a decision rule to see which brand wins and why.</p><div class="tabs">${[['simple','Simple additive'],['weighted','Weighted additive'],['lexi','Lexicographic'],['eba','Elimination-by-aspects'],['conj','Conjunctive']].map(([k,t])=>`<button class="${rule===k?'active':''}" onclick="rule='${k}';render()">${t}</button>`).join('')}</div>${rule==='eba'?`<label class="label" for="ebaSel">Must be “Excellent” on…</label><select id="ebaSel" onchange="ebaAttr=Number(this.value);render()">${rAttrs.map(([a],i)=>`<option value="${i}" ${ebaAttr===i?'selected':''}>${a}</option>`).join('')}</select>`:''}${rule==='conj'?`<label class="label" for="conjSel">Every attribute must be at least…</label><select id="conjSel" onchange="conjCut=this.value;render()"><option value="G" ${conjCut==='G'?'selected':''}>Good</option><option value="E" ${conjCut==='E'?'selected':''}>Excellent</option></select>`:''}<div class="table-wrap" style="margin-top:14px"><table><tr><th>Attribute</th><th>Rank</th>${rBrands.map(b=>`<th>${b}</th>`).join('')}</tr>${rAttrs.map(([a,r],i)=>`<tr><td>${a}</td><td>${r}</td>${rTable[i].map(v=>`<td>${{E:'Excellent',G:'Good',P:'Poor'}[v]}</td>`).join('')}</tr>`).join('')}</table></div><div class="output" aria-live="polite">${ruleResult()}</div>`;
const c=contextScen[ctx.id];return `<span class="badge">LAB 07 · LESSONS 7.3 + 7.4</span><h2 style="margin-top:12px">Same facts. Different frame.</h2><p class="muted small">Pick a scenario, then flip between the two versions to see how context changes the choice.</p><div class="tabs">${Object.entries(contextScen).map(([k,v])=>`<button class="${ctx.id===k?'active':''}" onclick="ctx={id:'${k}',side:0};render()">${v[0]}</button>`).join('')}</div><div class="lab-grid"><div class="lab-panel"><div class="eyebrow">SCENARIO</div><h3>${c[3]}</h3><div class="choice-grid" style="margin-top:16px"><button class="choice-tile ${ctx.side===0?'active':''}" onclick="ctx.side=0;render()"><b>Version A</b><span>${c[1]}</span></button><button class="choice-tile ${ctx.side===1?'active':''}" onclick="ctx.side=1;render()"><b>Version B</b><span>${c[2]}</span></button></div></div><div class="output" aria-live="polite"><span class="badge">${ctx.side?c[2]:c[1]}</span><h3 style="margin-top:10px">${c[0]}</h3><p>${ctx.side?c[5]:c[4]}</p></div></div>`}
function updateFishbein(){const w=fbAttrs.map((_,i)=>Number(document.getElementById('fb'+i).value));w.forEach((v,i)=>document.getElementById('fbv'+i).textContent=v);const sc=fbSchools.map((_,s)=>fbAttrs.reduce((t,a,i)=>t+a[2][s]*w[i],0));const mx=Math.max(...sc,1);document.getElementById('fbBars').innerHTML=fbSchools.map((s,i)=>`<div><span>${s}</span><div class="progress-track"><span style="width:${sc[i]/mx*100}%"></span></div><span>${sc[i]}</span></div>`).join('');const win=fbSchools.filter((_,i)=>sc[i]===mx);document.getElementById('fbOut').innerHTML=`<h3>Most favorable: ${win.join(' & ')}</h3><p>Each score = Σ (belief × importance). ${win.includes('Warren')&&win.length===1?'With the textbook weights, Alex’s top priority (all women, 7) drives Warren’s win.':'Changing importance weights, not the schools themselves, changed the winner.'}</p>`}
function drawTriad(){const col=v=>v>0?'#146a52':'#a33538',sg=v=>v>0?'+':'−';const P={c:[60,200],d:[260,200],e:[160,40]};const line=(a,b,v)=>`<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="${col(v)}" stroke-width="4" ${v<0?'stroke-dasharray="8 6"':''}/><circle cx="${(P[a][0]+P[b][0])/2}" cy="${(P[a][1]+P[b][1])/2}" r="15" fill="white" stroke="${col(v)}" stroke-width="2"/><text x="${(P[a][0]+P[b][0])/2}" y="${(P[a][1]+P[b][1])/2+6}" text-anchor="middle" font-size="18" font-weight="800" fill="${col(v)}">${sg(v)}</text>`;const node=(k,t)=>`<circle cx="${P[k][0]}" cy="${P[k][1]}" r="34" fill="#eaf0e3" stroke="#cbd9c4"/><text x="${P[k][0]}" y="${P[k][1]+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#172b2b">${t}</text>`;document.getElementById('triadSvg').innerHTML=`<svg viewBox="0 0 320 250" role="img" aria-label="Balance theory triad">${line('c','d',triad.pd)}${line('c','e',triad.pe)}${line('d','e',triad.de)}${node('c','Chris')}${node('d','Dan')}${node('e','Earring')}</svg>`;triadLinks.forEach(([t,k])=>document.getElementById('tl'+k).textContent=triad[k]>0?'+ likes / positive':'− dislikes / negative');const bal=triad.pd*triad.pe*triad.de>0;document.getElementById('triadOut').innerHTML=bal?`<span class="badge">BALANCED</span><h3 style="margin-top:8px">No tension.</h3><p>The product of the signs is positive. Chris has no pressure to change anything.</p>`:`<span class="badge" style="color:var(--red)">UNBALANCED</span><h3 style="margin-top:8px">Tension! Something has to give.</h3><p>Restore balance by flipping <b>one</b> link: dislike Dan, start liking earrings, or disconnect Dan from the earring (“it was a fraternity initiation”). The theory predicts a change, not which one.</p>`}
function elmResult(){if(!elm.cue)return '<h3>Pick a cue</h3><p>Under low involvement, cues around the message do the work. Under high involvement, the arguments do.</p>';const hi=elm.inv==='high',c=elm.cue,p=elm.prod;let route,impact,txt;if(c==='args'){route=hi?'Central':'Mostly ignored';impact=hi?'High':'Low';txt=hi?'Motivated viewers scrutinize the “steak.” Strong arguments generate supportive thoughts; weak ones generate counterarguments.':'Low-involvement viewers won’t process detailed arguments. The paradox of low involvement: presentation matters more than content.'}else if(c==='model'){const central=p==='shampoo';route=central?'Central cue':'Peripheral cue';impact=central?'High':(hi?'Low':'Moderate–high');txt=central?'For shampoo, attractiveness IS the product benefit, so the model is message-relevant evidence even for careful thinkers.':'For a car, attractiveness is unrelated to performance. It sways low-involvement viewers but adds little for those evaluating the car.'}else if(c==='story'){route='Narrative transportation';impact='High';txt='Stories draw viewers in and reduce counterarguing in both modes. Narrative ads are also shared more.'}else{route='Peripheral cue';impact=hi?'Low':'High';txt=c==='celeb'?'Celebrity endorsements increase product liking, especially for low-involvement viewers and when the star is congruent with the product. Involved viewers want reasons.':'Packaging, color, and visuals are classic peripheral cues: powerful when people aren’t motivated to think, minor when they are.'}return `<span class="badge">${route} · IMPACT: ${impact}</span><h3 style="margin-top:10px">${elmCues.find(x=>x[0]===c)[1]} in a ${p} ad</h3><p>${txt}</p>`}
function showInfluence(k){const v=influence[k];document.getElementById('infOut').innerHTML=`<span class="badge">PRINCIPLE</span><h3 style="margin-top:8px">${v[0]}</h3><p class="small"><b>${v[1]}</b></p><p class="small"><b>The study:</b> ${v[2]}</p><div class="callout"><strong>Use it ethically</strong>${v[3]}</div>`}
function drawRep(){const n=Number(document.getElementById('repN').value);document.getElementById('repV').textContent=n;const L=x=>10*(1-Math.exp(-x/2)),T=x=>.06*x*x,Net=x=>L(x)-T(x);const X=x=>30+x*24,Y=y=>140-y*10;const pts=f=>Array.from({length:49},(_,i)=>i/4).map(x=>`${X(x)},${Y(f(x))}`).join(' ');document.getElementById('repSvg').innerHTML=`<svg viewBox="0 0 340 270" role="img" aria-label="Two-factor theory curves"><line x1="30" y1="140" x2="320" y2="140" stroke="#cfdacf"/><line x1="30" y1="20" x2="30" y2="260" stroke="#cfdacf"/><polyline points="${pts(L)}" fill="none" stroke="#146a52" stroke-width="3"/><polyline points="${pts(x=>-T(x))}" fill="none" stroke="#a33538" stroke-width="3"/><polyline points="${pts(Net)}" fill="none" stroke="#d96d3c" stroke-width="3" stroke-dasharray="6 5"/><line x1="${X(n)}" y1="20" x2="${X(n)}" y2="260" stroke="#172b2b" stroke-width="1.5"/><circle cx="${X(n)}" cy="${Y(Net(n))}" r="6" fill="#d96d3c"/><text x="250" y="70" font-size="11" fill="#146a52" font-weight="700">Learning</text><text x="230" y="250" font-size="11" fill="#a33538" font-weight="700">Tedium</text><text x="40" y="30" font-size="11" fill="#d96d3c" font-weight="700">- - Net effect</text><text x="268" y="156" font-size="10" fill="#596d6a">exposures</text></svg>`;const net=Net(n);document.getElementById('repOut').innerHTML=n<=3?`<h3>Building familiarity</h3><p>Net effect is rising: the mere exposure effect is winning. Research suggests “three’s the charm” for product claims.</p>`:net>0?`<h3>Diminishing returns</h3><p>Boredom is catching up. The net effect is still positive but falling. Time to space exposures or vary the creative.</p>`:`<h3>Wear-out</h3><p>Tedium now exceeds the learning benefit. More repetition creates negative reactions.</p>`}
function ruleResult(){const v=rTable.map(r=>r.map(x=>ratings[x]));const order=[0,1,2,3,4,5,6];if(rule==='simple'){const s=rBrands.map((_,b)=>v.filter(r=>r[b]===3).length);const m=Math.max(...s);return `<span class="badge">COMPENSATORY</span><h3 style="margin-top:8px">Winner: ${rBrands.filter((_,i)=>s[i]===m).join(' & ')}</h3><p>Count of “Excellent” ratings: ${rBrands.map((b,i)=>b+' '+s[i]).join(' · ')}. Simple, but it treats unimportant attributes the same as important ones.</p>`}if(rule==='weighted'){const w=rAttrs.map(([,r])=>7-r);const s=rBrands.map((_,b)=>v.reduce((t,r,i)=>t+r[b]*w[i],0));const m=Math.max(...s);return `<span class="badge">COMPENSATORY</span><h3 style="margin-top:8px">Winner: ${rBrands.filter((_,i)=>s[i]===m).join(' & ')}</h3><p>Weight = 7 − rank (rank 1 → 6). Score = Σ rating (E=3, G=2, P=1) × weight: ${rBrands.map((b,i)=>b+' '+s[i]).join(' · ')}. Just like the Fishbein model, strengths offset weaknesses.</p>`}if(rule==='lexi'){let alive=[0,1,2],steps=[];for(const i of order){const m=Math.max(...alive.map(b=>v[i][b]));const keep=alive.filter(b=>v[i][b]===m);steps.push(`${rAttrs[i][0]}: ${keep.map(b=>rBrands[b]).join(', ')} best`);alive=keep;if(alive.length===1)break}return `<span class="badge">NONCOMPENSATORY</span><h3 style="margin-top:8px">Winner: ${alive.map(b=>rBrands[b]).join(' & ')}</h3><p>${steps.join(' → ')}. This is Chan’s actual rule: Optimus and Syop tie on CPU, and the graphics card breaks the tie.</p>`}if(rule==='eba'){const pass=[0,1,2].filter(b=>v[ebaAttr][b]===3);let alive=pass;if(alive.length>1){for(const i of order){const m=Math.max(...alive.map(b=>v[i][b]));alive=alive.filter(b=>v[i][b]===m);if(alive.length===1)break}}return `<span class="badge">NONCOMPENSATORY</span><h3 style="margin-top:8px">${alive.length?'Winner: '+alive.map(b=>rBrands[b]).join(' & '):'No brand survives'}</h3><p>Cutoff: must be Excellent on ${rAttrs[ebaAttr][0]}. Survivors: ${pass.map(b=>rBrands[b]).join(', ')||'none'}${pass.length>1?'; ties broken by the next most important attribute':''}. The textbook example: requiring extra motherboard slots points to Babylon.</p>`}const cut=ratings[conjCut];const pass=[0,1,2].filter(b=>v.every(r=>r[b]>=cut));return `<span class="badge">NONCOMPENSATORY · PROCESSES BY BRAND</span><h3 style="margin-top:8px">${pass.length?'Acceptable: '+pass.map(b=>rBrands[b]).join(', '):'No brand meets every cutoff'}</h3><p>Each brand must meet the cutoff (${conjCut==='G'?'Good':'Excellent'}) on <b>every</b> attribute. Failing one means rejection. ${pass.length?'':'If none pass, the buyer delays, changes the rule, or lowers cutoffs.'} Note: the textbook narrative says no brand passes at “good,” but Table 7.1’s ratings let Optimus pass, so know the textbook’s explanation for the exam.</p>`}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function prepareQuestion(q){const order=shuffle(q.options.map((_,i)=>i));return {...q,options:order.map(i=>q.options[i]),answer:order.indexOf(q.answer)}}
function openSectionPractice(id){qSession=null;go('practice');document.getElementById('practiceSection').value=id;document.getElementById('practiceCount').value='5'}
function startPractice(wrongOnly=false){let pool;if(wrongOnly&&qSession){pool=qSession.items.filter((q,i)=>qSession.responses[i]!==q.answer)}else{const section=document.getElementById('practiceSection').value;pool=section==='all'?questions:questions.filter(q=>q.section===section||q.section.startsWith(section+'.'));const count=Number(document.getElementById('practiceCount').value);const ls=lessonData.filter(l=>pool.some(q=>q.section===l.id));if(count>=ls.length&&ls.length>1){const starters=ls.map(l=>shuffle(pool.filter(q=>q.section===l.id))[0]);const used=new Set(starters.map(q=>q.id));pool=shuffle([...starters,...shuffle(pool.filter(q=>!used.has(q.id))).slice(0,Math.max(0,count-starters.length))])}else pool=shuffle(pool).slice(0,count)}if(!pool.length)return;qSession={items:pool.map(prepareQuestion),responses:[],index:0,selected:null,checked:false,finished:false};render();window.scrollTo({top:0,behavior:'instant'})}
function practice(){if(qSession&&!qSession.finished)return quizView();if(qSession?.finished)return resultsView();return `<div class="eyebrow">ACTIVE RETRIEVAL</div><h1 style="margin-bottom:14px">Know it. Then apply it.</h1><p class="muted">Original scenarios test the concept, not just the definition. Every answer comes with an explanation.</p><div class="grid2" style="margin-top:28px"><div class="card"><span class="badge">BUILD YOUR PRACTICE SESSION</span><h2 style="margin:12px 0 20px">Choose your focus.</h2><label class="label" for="practiceSection">Chapter or section</label><select id="practiceSection"><option value="all">Both chapters · balanced coverage</option><option value="6">Chapter 6 · attitudes & persuasion</option><option value="7">Chapter 7 · decision making</option>${lessonData.map(l=>`<option value="${l.id}">${l.id==='6.V'?'Cialdini':l.id} · ${l.title}</option>`).join('')}</select><label class="label" for="practiceCount">Question count</label><select id="practiceCount"><option value="10">10 questions</option><option value="20" selected>20 questions</option><option value="${questions.length}">${questions.length} questions · full bank</option><option value="5">5 questions · quick check</option></select><p class="small muted" style="margin-top:12px">Each section has 5–7 questions. Requests above the available count use the full set.</p><button class="btn" style="margin-top:10px" onclick="startPractice()">Start practice →</button></div><div class="card" style="background:#e7eee0"><div class="eyebrow">A BETTER WAY TO STUDY</div><h2>Reason before you click.</h2><ol class="small"><li>Name the concept in your own words.</li><li>Look for the clue: a route, a frame, a rule, a principle.</li><li>Choose an answer, then read the explanation.</li><li>Retry missed questions.</li></ol><p class="small muted">This is practice, not a prediction of your instructor’s quiz.</p>${state.attempts.length?`<div class="output"><span class="badge">YOUR LAST SESSION</span><div class="metric">${state.attempts[state.attempts.length-1].score}%</div><p>${state.attempts[state.attempts.length-1].n} questions · best session ${state.best}%</p></div>`:''}</div></div>`}
function quizView(){const s=qSession,q=s.items[s.index];return `<div class="row" style="justify-content:space-between"><div class="eyebrow" style="margin:0">PRACTICE SESSION</div><button class="linkbtn small" onclick="leaveSession()">End session</button></div><div class="progress-track"><span style="width:${s.index/s.items.length*100}%"></span></div><div class="quiz-head"><span>Question ${s.index+1} of ${s.items.length}</span><span>${q.section==='6.V'?'Cialdini':'Lesson '+q.section} · ${lessonData.find(l=>l.id===q.section).title}</span></div><div class="card question"><span class="badge">READ THE SCENARIO</span><h3 style="margin-top:17px">${q.prompt}</h3><div role="group" aria-label="Answer options">${q.options.map((o,i)=>`<button class="option ${s.selected===i?'chosen':''} ${s.checked&&q.answer===i?'correct':''} ${s.checked&&s.selected===i&&q.answer!==i?'incorrect':''}" ${s.checked?'disabled':''} aria-pressed="${s.selected===i}" onclick="selectOption(${i})"><span class="letter">${String.fromCharCode(65+i)}</span><span>${o}</span>${s.checked&&q.answer===i?'<span style="margin-left:auto">✓</span>':''}</button>`).join('')}</div>${s.checked?`<div class="feedback ${s.selected===q.answer?'':'wrong'}" role="status"><strong>${s.selected===q.answer?'Correct. You nailed the concept.':'Good opportunity to clarify the distinction.'}</strong><p>${q.why}</p>${s.selected!==q.answer?`<p><b>Correct answer:</b> ${q.options[q.answer]}</p>`:''}</div><div class="row" style="justify-content:space-between"><button class="linkbtn small" onclick="go('learn','${q.section}')">Review lesson ${q.section}</button><button class="btn" onclick="nextQuestion()">${s.index===s.items.length-1?'See my results':'Next question'} →</button></div>`:`<button class="btn" style="margin-top:15px;opacity:${s.selected===null?'.5':'1'}" ${s.selected===null?'disabled':''} onclick="checkAnswer()">Check answer</button>`}</div>`}
function selectOption(i){if(qSession.checked)return;qSession.selected=i;render();document.querySelectorAll('.option')[i].focus()}
function checkAnswer(){const s=qSession;if(s.selected===null||s.checked)return;s.responses[s.index]=s.selected;s.checked=true;render();const f=document.querySelector('.feedback');f.setAttribute('tabindex','-1');f.focus()}
function nextQuestion(){const s=qSession;if(!s.checked)return;if(s.index<s.items.length-1){s.index++;s.selected=null;s.checked=false}else{s.finished=true;const correct=s.items.filter((q,i)=>q.answer===s.responses[i]).length;const score=Math.round(correct/s.items.length*100);state.best=Math.max(state.best,score);state.attempts.push({score,n:s.items.length});state.attempts=state.attempts.slice(-30);save()}render();window.scrollTo({top:0,behavior:'instant'})}
function leaveSession(){if(confirm('End this unfinished session? It will not be added to your scores.')){qSession=null;render()}}
function resultsView(){const s=qSession,correct=s.items.filter((q,i)=>q.answer===s.responses[i]).length,wrong=s.items.filter((q,i)=>q.answer!==s.responses[i]),sections=lessonData.map(l=>l.id).filter(id=>s.items.some(q=>q.section===id));return `<div class="eyebrow">SESSION COMPLETE</div><h1 style="margin-bottom:15px">Turn feedback into progress.</h1><div class="grid2"><div class="card"><div class="score">${Math.round(correct/s.items.length*100)}<span>%</span></div><p class="muted">${correct} of ${s.items.length} correct on this question set.</p><div class="row"><button class="btn" onclick="qSession=null;render()">New session</button>${wrong.length?'<button class="btn secondary" onclick="startPractice(true)">Retry missed questions</button>':''}</div></div><div class="card"><h3>Performance by section</h3><div class="score-bars">${sections.map(id=>{let qs=s.items.map((q,i)=>({q,i})).filter(x=>x.q.section===id);let n=qs.filter(x=>x.q.answer===s.responses[x.i]).length;return `<div><button class="linkbtn" onclick="go('learn','${id}')">${id==='6.V'?'Cialdini':'Lesson '+id}</button><div class="progress-track"><span style="width:${n/qs.length*100}%"></span></div><span>${n}/${qs.length}</span></div>`}).join('')}</div></div></div>${wrong.length?`<div class="section-row"><h2>Review your missed concepts</h2></div><div class="summary-list">${s.items.map((q,i)=>q.answer!==s.responses[i]?`<details><summary>${q.section} · ${q.prompt}</summary><p><b>Your answer:</b> ${q.options[s.responses[i]]}</p><p><b>Correct:</b> ${q.options[q.answer]}</p><p>${q.why}</p><p><button class="linkbtn" onclick="go('learn','${q.section}')">Revisit the explanation →</button></p></details>`:'').join('')}</div>`:''}`}
function flashcards(){return `<div class="eyebrow">RETRIEVE → EXPLAIN → CHECK</div><h1 style="margin-bottom:12px">Build your working vocabulary.</h1><p class="muted">Say the meaning aloud before you reveal it. “Known” is your own assessment.</p><div class="filter-bar"><select aria-label="Flashcard chapter" id="flashChapter" onchange="filterFlash()"><option value="all">All terms</option><option value="6">Chapter 6</option><option value="7">Chapter 7</option></select><button class="btn secondary" onclick="flashPool=shuffle(flashPool);flashIndex=0;flashBack=false;renderFlashOnly()">Shuffle cards ↻</button></div><div id="flashArea">${flashInner()}</div><div class="callout"><strong>A useful habit</strong>After defining a term, give a real brand example. Then name a similar concept it could be confused with.</div>`}
function flashInner(){const c=flashPool[flashIndex];if(!c)return '<div class="empty">No cards in this selection.</div>';return `<div class="quiz-head"><span>Card ${flashIndex+1} of ${flashPool.length} · ${c[2]==='6.V'?'Cialdini':'Lesson '+c[2]}</span><span>${state.known.includes(c[0])?'✓ Marked known':'Ready to practice'}</span></div><button class="flashcard" onclick="flipCard()" aria-label="${flashBack?'Definition shown. Activate to return to term.':'Reveal definition for '+esc(c[0])}"><span class="badge">${flashBack?'PLAIN-LANGUAGE MEANING':'WHAT DOES THIS MEAN?'}</span>${flashBack?`<strong style="font-size:19px;color:var(--lime)">${c[0]}</strong><p>${c[1]}</p>`:`<strong>${c[0]}</strong><small>Think of a definition and an example.</small>`}<small>${flashBack?'Click or press Enter to return to the term':'Click or press Enter to reveal'}</small></button><div class="flash-controls"><button class="btn secondary" onclick="moveFlash(-1)">← Previous</button><button class="btn secondary" onclick="markFlash(false)">Keep practicing</button><button class="btn" onclick="markFlash(true)">I know this ✓</button><button class="btn secondary" onclick="moveFlash(1)">Next →</button></div><p class="small muted" style="text-align:center">${state.known.length} of ${glossary.length} total terms marked known</p>`}
function renderFlashOnly(){document.getElementById('flashArea').innerHTML=flashInner();updateSidebar()}
function filterFlash(){const v=document.getElementById('flashChapter').value;flashPool=glossary.filter(c=>v==='all'||c[2].startsWith(v+'.'));flashIndex=0;flashBack=false;renderFlashOnly()}
function flipCard(){flashBack=!flashBack;renderFlashOnly();document.querySelector('.flashcard').focus()}
function moveFlash(d){if(!flashPool.length)return;flashIndex=(flashIndex+d+flashPool.length)%flashPool.length;flashBack=false;renderFlashOnly()}
function markFlash(known){const t=flashPool[flashIndex][0];state.known=state.known.filter(x=>x!==t);if(known)state.known.push(t);save();moveFlash(1)}
function glossaryView(){return `<div class="eyebrow">NO JARGON LEFT BEHIND</div><h1 style="margin-bottom:12px">A business-to-human dictionary.</h1><p class="muted">${glossary.length} terms explained simply. Search a word, a meaning, or a confusion you want to clear up.</p><div class="filter-bar"><input id="glossSearch" type="search" placeholder="Try: frame, trust, regret, or default…" aria-label="Search glossary" oninput="filterGlossary()"><select id="glossChapter" aria-label="Filter glossary by chapter" onchange="filterGlossary()"><option value="all">Both chapters</option><option value="6">Chapter 6</option><option value="7">Chapter 7</option></select></div><p class="small muted" id="glossCount" role="status"></p><div class="gloss-grid" id="glossResults"></div>`}
function filterGlossary(){const query=document.getElementById('glossSearch').value.trim().toLowerCase(),ch=document.getElementById('glossChapter').value;const list=glossary.filter(([term,def,id])=>(ch==='all'||id.startsWith(ch+'.'))&&(term+' '+def).toLowerCase().includes(query)).sort((a,b)=>a[0].localeCompare(b[0]));document.getElementById('glossCount').textContent=`${list.length} terms`;document.getElementById('glossResults').innerHTML=list.length?list.map(([term,def,id])=>`<div class="term"><span class="badge">${id==='6.V'?'CIALDINI':'LESSON '+id}</span><h3 style="margin-top:9px">${term}</h3><p>${def}</p><button class="linkbtn" style="font-size:11px;margin-top:12px" onclick="go('learn','${id}')">See it in context →</button></div>`).join(''):'<p class="empty">No matching terms. Try a shorter word or a broader idea.</p>'}
function review(){return `<div class="eyebrow">BEFORE THE QUIZ</div><h1 style="margin-bottom:12px">The essentials, connected.</h1><p class="muted">Use these prompts for retrieval. Explain the idea, then open the note to check your reasoning.</p><div class="row" style="margin:20px 0"><button class="btn" onclick="go('practice')">Test my understanding →</button><button class="btn secondary" onclick="printReview()">Print review sheet</button></div><div class="summary-list">${lessonData.map(l=>{const [t,n]=quickNotes[l.id];return `<details><summary>${t}</summary><p>${n}</p><p><button class="linkbtn" onclick="go('learn','${l.id}')">Read the full lesson →</button></p></details>`}).join('')}</div><div class="section-row"><h2>The distinctions most worth practicing</h2></div><div class="table-wrap card"><table><tr><th>Do not confuse</th><th>Use this test</th></tr><tr><td>Utilitarian / value-expressive function</td><td>What it does for me, or what it says about me?</td></tr><tr><td>Mood / emotion</td><td>Temporary and not tied to an event, or intense and triggered by a specific event?</td></tr><tr><td>Central / peripheral route</td><td>High involvement and arguments, or low involvement and cues?</td></tr><tr><td>Two-sided / refutational</td><td>Shows both sides, or raises a negative and then dismisses it?</td></tr><tr><td>Mere exposure / wear-out</td><td>Familiarity is still building liking, or boredom has overtaken it?</td></tr><tr><td>Sleeper effect / halo effect</td><td>Forgetting a bad source over time, or one strength spilling over to others?</td></tr><tr><td>Evoked / consideration set</td><td>Brands you know, or brands you seriously consider?</td></tr><tr><td>Compensatory / noncompensatory</td><td>Can a strength offset a weakness, or does one failure eliminate it?</td></tr><tr><td>Lexicographic / elimination-by-aspects / conjunctive</td><td>Best on top attribute; best with cutoffs; must pass every cutoff (by brand)?</td></tr><tr><td>Inertia / brand loyalty</td><td>Easy habit, or conscious commitment? (Out-of-stock test)</td></tr><tr><td>Maximizing / satisficing</td><td>Best possible, or good enough (bounded rationality)?</td></tr><tr><td>Prime / nudge</td><td>A cue that activates a mindset, or a deliberate change to the choice structure?</td></tr><tr><td>Gain frame / loss frame</td><td>Risk averse, or risk seeking?</td></tr><tr><td>Regret / decision paralysis</td><td>Wishing you chose the forgone option, or too afraid to choose at all?</td></tr><tr><td>Word-of-mouth / word-of-machine</td><td>Trusting people (hedonic) or AI (utilitarian)?</td></tr></table></div><div class="case-card"><span class="badge">CHAPTER 6 CASE</span><h3 style="margin:10px 0">Anti-smoking ads: can you be scared into quitting?</h3><p>The CDC used graphic fear appeals (a woman who lost her voice box), while Truth framed smoking as funding “big corporations,” and Ireland’s PSA lip-synced “I Will Survive.” Adult smoking fell from 45% (1954) to 16% (2021).</p><details><summary>Apply the chapter</summary><p>Fear appeals work best for <b>prevention-focused</b> people and can backfire with some teens, who get defensive. <b>Promotion-focused</b> people respond to positive, aspirational messages (“You Quit. You Win.”). Different segments need different appeals. Repeated pack warnings risk <b>habituation</b>.</p></details></div><div class="case-card" style="background:#e9f0e4;border-color:#d4dfca"><span class="badge">CHAPTER 7 CASE</span><h3 style="margin:10px 0">P&G and the moments of truth</h3><p>&lt;ZMOT (a trigger) → ZMOT (online research, Google 2011) → FMOT (at the shelf) → SMOT (using it) → TMOT (feedback) → 4MOT (ongoing support and loyalty) → 5MOT (advocacy). Plus AMOT (between online order and delivery), micro-moments, and UMOT (they all merge on mobile).</p><details><summary>Apply the chapter</summary><p>The MOTs map onto the decision steps: ZMOT = information search, FMOT = evaluation and choice, SMOT through 5MOT = postpurchase evaluation. Social scoring, reviews, and word-of-mouth live in TMOT and 5MOT.</p></details></div><div class="case-card" style="background:white"><span class="badge">ASSIGNED ARTICLES</span><h3 style="margin:10px 0">Use the frameworks on the news</h3><p><b>Cracker Barrel suspends remodels after logo flop (Ch 6):</b> strong, nostalgic, identity-linked attitudes (like New Coke) resisted change. The redesign was tested at only 4 of 660 stores, the stock fell up to 12%, and the company reversed both the logo and the remodels. Consider balance theory: influencers framed the logo politically, and fans who liked those voices turned against the change.</p><p><b>How “boring” Oracle became cool again (Ch 7):</b> Oracle went from a cloud latecomer (Ellison called cloud “complete gibberish” in 2008) to an AI winner, with RPOs up 359% and the stock up 80%+. Think about investor heuristics: the <b>magnitude heuristic</b> (huge percentages), <b>anchoring</b> on projections ($144B by 2030), and <b>availability</b> of AI hype. Analysts warn demand could undershoot, so loss aversion and framing matter for how risk is perceived.</p></div><div class="callout"><strong>A focused 45-minute review</strong>15 min: explain the distinctions table without notes. 20 min: a mixed 20-question practice session, reading every explanation. 10 min: Cialdini’s six studies + the decision rules lab.</div>`}
function printReview(){document.querySelectorAll('.summary-list details,.case-card details').forEach(d=>d.open=true);window.print()}
function render(){updateSidebar();let content=view==='home'?overview():view==='learn'?lessons():view==='labs'?labs():view==='practice'?practice():view==='flashcards'?flashcards():view==='glossary'?glossaryView():review();document.getElementById('main').innerHTML=content+footer();if(view==='glossary')filterGlossary();if(view==='labs'){if(lab==='fishbein')updateFishbein();if(lab==='balance')drawTriad();if(lab==='repetition')drawRep()}}
render();

</script></body></html>
