<script>
'use strict';
const lessonData=[
{id:'6.1',chapter:6,title:'What an attitude is',subtitle:'Functions, beliefs, feelings & the Fishbein model',lead:'An attitude is your lasting overall judgment of something: a brand, a person, an ad, an issue. It guides what you do, but other forces can get in the way.',takeaway:'Attitude = lasting, general evaluation. It has a cognitive side (“I know it”) and an affective side (“I feel it”). Subjective norms can override what you personally prefer.',blocks:[
['Start with the plain-language definition',`<p>An <b>attitude</b> is a <b>lasting, general evaluation</b> of people (including yourself), objects, ads, or issues. <b>Lasting</b> means it endures over time. <b>General</b> means it applies to more than one moment. The thing you have the attitude about is the <b>attitude object (A<sub>o</sub>)</b>: “I prefer Crest over Colgate” makes Crest an attitude object.</p><p>Figure 6.1 connects the chapter: <b>persuasion</b> forms or changes an <b>attitude</b>, and the attitude guides <b>behavior</b>. Whether the attitude actually turns into behavior depends on attitude commitment and the social context (norms and social pressure).</p>`],
['Why we have attitudes: the functional theory',`<p>Daniel Katz’s <b>functional theory of attitudes</b> says attitudes exist because they do a job for the person.</p><div class="table-wrap"><table><tr><th>Function</th><th>Plain meaning</th><th>Example</th></tr><tr><td>Utilitarian</td><td>Based on reward and punishment: what the product does for me</td><td>I like cheeseburgers because they taste good</td></tr><tr><td>Value-expressive</td><td>Says something about who I am and what I value</td><td>A beret signals creative; a fedora signals old-fashioned sophistication</td></tr></table></div><p>Messages that stress straightforward product benefits speak to the utilitarian function.</p>`],
['Cool attitudes vs. hot attitudes',`<p>Attitudes contain <b>cognitive</b> (beliefs) and <b>affective</b> (emotional) elements. Some attitudes are “cool,” built from what we believe we know. Others are “hot,” driven by emotional reactions (“the sushi at the student union wasn’t fresh”). This matches <b>slow thinking</b> (Type 2: deliberate, analytic) vs. <b>fast thinking</b> (Type 1: fast, automatic, intuitive).</p><div class="callout"><strong>“I Know It”: cognitive focus</strong>Cognitive models focus on <b>beliefs</b> about the product, accurate or not. In an age of misinformation, making sure customers have correct beliefs matters even more.</div>`],
['The multiattribute model (Fishbein)',`<p><b>Multiattribute attitude models</b> say your overall attitude is built from beliefs about several attributes. Three elements:</p><ul><li><b>Attributes:</b> characteristics of the A<sub>o</sub> (a college’s academic reputation).</li><li><b>Beliefs:</b> how much you think this brand has that attribute.</li><li><b>Importance weights:</b> how much each attribute matters to you.</li></ul><p>The <b>Fishbein model</b>: <b>A<sub>jk</sub> = Σ β<sub>ijk</sub> × I<sub>ik</sub></b>. Multiply each belief by its importance, then add them up. In Table 6.1, Alex scores Warren 163, State 153, Ivy 142, Northland 131. Her top weight is “all women” (7), so Warren wins.</p><div class="table-wrap"><table><tr><th>Marketing application</th><th>What Northland could do</th></tr><tr><td>Capitalize on relative advantage</td><td>Convince Alex that social atmosphere (where it scores high) matters more</td></tr><tr><td>Strengthen perceived product/attribute linkages</td><td>Run a “little-known facts about Northland” campaign about academics and library</td></tr><tr><td>Add a new attribute</td><td>Promote a hands-on internship program (Everlane added “radical transparency”)</td></tr><tr><td>Influence competitors’ ratings</td><td>Comparative ads showing tuition vs. rival schools</td></tr></table></div>`],
['“I Feel It”: moods, emotions & mood congruency',`<p>A <b>mood</b> is a temporary positive or negative state <i>not</i> tied to a specific event (“woke up on the wrong side of the bed”). An <b>emotion</b> (happiness, anger, fear) is more intense and usually triggered by a specific event, like receiving a great gift.</p><p><b>Mood congruency</b>: we judge the same product more positively in a good mood. That’s why ads follow funny shows and stores play upbeat music. Marketers can also use negative feelings productively: show a distressing image, then offer a way to fix it (a charity ad). Slides add <b>sadvertising</b>: inspirational stories designed to move you emotionally (Nike “Dream Crazier”).</p><p><b>Pretty napkins study:</b> people used about half as many holiday-print toilet paper sheets and ate fewer fancy cupcakes. We avoid “wasting” beautiful things.</p><div class="callout orange"><strong>From your syllabus: the theory of constructed emotion</strong>This isn’t in the textbook chapter or slides, so check your lecture notes. In Lisa Feldman Barrett’s theory, emotions are not fixed, hardwired reactions. The brain <i>constructs</i> them in the moment by predicting what body sensations mean, using past experience, context, and learned emotion concepts. Marketing takeaway: context and framing shape which emotion a consumer actually feels.</div>`],
['Why attitudes don’t always predict behavior',`<ul><li><b>Ambivalence:</b> you feel positive and negative at the same time (you love your phone but hate its notifications).</li><li><b>Explicit vs. implicit attitudes:</b> explicit = conscious; implicit = outside awareness. <b>Social desirability bias</b> means people report only acceptable attitudes. Explicit attitudes change faster; implicit ones change slowly or not at all.</li><li><b>Social pressure / normative influences:</b> what we think others expect. <b>Social proof</b> (Cialdini) means we follow others’ actions, especially similar peers.</li></ul><p><b>Medication adherence</b> shows the gap: CVS found one-third of customers stopped taking chronic medication after a month.</p><p>The <b>Theory of Reasoned Action</b> improves Fishbein by adding <b>subjective norms (SN)</b> = <b>normative belief (NB)</b> × <b>motivation to comply (MC)</b>. If Alex’s parents want her near home (high NB) but she doesn’t care (low MC), their norm has little effect. If her best friend wants it and she cares (high MC), the norm shifts her attitude.</p>`]],work:'When a customer says they love your product but never buys it, look for the gap: subjective norms, ambivalence, or social pressure may be overriding the attitude.',lab:'fishbein'},
{id:'6.2',chapter:6,title:'How attitudes form',subtitle:'Attitude strength, balance theory & reflected glory',lead:'You aren’t born preferring Pepsi to Coke. Attitudes form over time, and how they form decides how hard they are to change.',takeaway:'Attitudes formed cognitively are stronger and more durable. Strong attitudes resist change (New Coke). Balance theory: we adjust one of three links to keep a triad consistent.',blocks:[
['Strong vs. weak attitudes',`<p>Attitudes formed through a <b>cognitive</b> process are stronger and longer-lasting than those formed from an emotional response. Attitudes are also stronger when the object is <b>personally important</b>. We are more likely to act on strong attitudes. Weak attitudes are fuzzy, so a friend’s opinion can flip them.</p><div class="table-wrap"><table><tr><th>Table 6.2 feature</th><th>The question it asks</th></tr><tr><td>Accessibility</td><td>How quickly does the attitude come to mind?</td></tr><tr><td>Ambivalence</td><td>Do I have mixed feelings?</td></tr><tr><td>Certainty</td><td>How sure am I?</td></tr><tr><td>Elaboration</td><td>How much have I thought about it?</td></tr><tr><td>Importance</td><td>How significant is it to me?</td></tr><tr><td>Intensity</td><td>How strongly do I feel?</td></tr><tr><td>Knowledge volume</td><td>How much do I know?</td></tr><tr><td>Vested interest</td><td>How personally consequential is it?</td></tr></table></div>`],
['Don’t mess with strong attitudes: New Coke',`<p>In the 1980s Coca-Cola changed its formula to taste sweeter, like Pepsi. Blind taste tests said people preferred it. But die-hard fans revolted because Coke was tied to their <b>social identity</b>, patriotism, and nostalgia. It was never just a taste preference.</p><div class="callout orange"><strong>Connect it: Cracker Barrel (your assigned article)</strong>Cracker Barrel dropped its “Old Timer” logo and planned minimalist remodels it had tested at only 4 of 660 restaurants. Customers with strong, nostalgic, identity-linked attitudes pushed back, the stock fell as much as 12%, and the company reversed both the logo and the remodels. It’s a modern New Coke: strong attitudes are hard to change.</div>`],
['Balance theory',`<p><b>Balance theory</b> looks at how we keep our attitudes consistent across three elements, called a <b>triad</b>: (1) a person and their perceptions of (2) an attitude object and (3) another person or object. When the triad is unbalanced, we feel tension and change something to restore balance (similar to cognitive dissonance).</p><p><b>Quick test:</b> multiply the three signs. If the product is positive (+ + +, or two minuses), it’s balanced. If it’s negative, it’s unbalanced.</p><p><b>Chris → Dan (+), Dan → earring (+), Chris → men’s earrings (−)</b> is unbalanced. Chris can restore balance three ways:</p><ol><li>Start disliking Dan.</li><li>Start liking earrings.</li><li>Disconnect Dan from the earring (“it was a fraternity initiation”).</li></ol><p>The theory predicts Chris will change <i>something</i>, but not which option.</p>`],
['Why marketers care: celebrity and brand transfer',`<p>Balance theory explains why liking a person transfers to the brand linked with them. If you like Ted Lasso and he’s often shown with Apple products, your attitude toward Apple improves. It works both ways: liking Apple can make you like the character more.</p><p><b>Basking in reflected glory:</b> at Arizona State, more students wore school gear the Monday after a football win. The bigger the winning margin, the more school apparel researchers saw.</p>`]],work:'Before partnering with an endorser, map the triad: if your audience dislikes the endorser, balance theory says something has to give, and it might be your brand.',lab:'balance'},
{id:'6.3',chapter:6,title:'How persuasion works',subtitle:'ELM, narrative transportation & persuasion knowledge',lead:'Persuasion is an active attempt to create or change attitudes. Whether a message works depends on how much the audience is willing to think.',takeaway:'High involvement → central route (the “steak”: arguments). Low involvement → peripheral route (the “sizzle”: cues). Stories reduce counterarguing; persuasion knowledge increases it.',blocks:[
['The Elaboration Likelihood Model (ELM)',`<p><b>Persuasion</b> is an active attempt to create or change attitudes. It’s Job #1 for marketing communicators.</p><div class="table-wrap"><table><tr><th></th><th>Central route</th><th>Peripheral route</th></tr><tr><td>Involvement</td><td>High (System 2)</td><td>Low (System 1)</td></tr><tr><td>Processing</td><td>Cognitive, slow</td><td>Affective, fast</td></tr><tr><td>Focus</td><td>The “steak”: strong, rational arguments</td><td>The “sizzle”: package, endorser, emotions</td></tr><tr><td>Sequence (Fig 6.3)</td><td>Cognitive responses → belief & attitude change → behavior change</td><td>Belief change → behavior change → attitude change</td></tr></table></div><p>Most of us process most ads peripherally.</p>`],
['Fast persuasion: the peripheral route',`<p><b>Peripheral cues</b> are information outside the actual message: packaging, source attractiveness, context. The <b>paradox of low involvement</b>: when we don’t care much about a product, <i>how</i> it’s presented matters more.</p><p>Incidental brand exposure examples: an Apple sign led to more unique responses than IBM; a “cute” ice cream scoop led to bigger servings; an MIT pen raised GRE scores; vaping in music videos made youth more positive toward e-cigarettes.</p>`],
['Slow persuasion: the central route',`<p>When the message feels relevant, we pay careful attention and process arguments. We may generate <b>counterarguments</b> (reasons it’s wrong or doesn’t apply to me, part of our cognitive defenses) or supporting arguments. More counterarguments → less yielding.</p><div class="callout"><strong>Same cue, different route</strong>An attractive model is a <i>peripheral</i> cue in a car ad but a <i>central</i> cue in a shampoo ad, because attractiveness is the shampoo’s actual benefit.</div>`],
['Narrative persuasion',`<p><b>Narrative transportation</b> is how immersed you feel in a story. Stories (a plot centered on a character) persuade better than lectures: a lecture implies a passive audience, while a story draws you in so you accept the premise <b>without counterarguing</b>. Narrative ads also get shared more.</p><p><b>Narrativity</b> is how much a message tells a story. Across about 200,000 online reviews, more story-like reviews were more transporting and persuasive. Hinge’s “No Ordinary Love” campaign told six real couples’ stories.</p>`],
['Persuasion knowledge: talking back',`<p><b>Persuasion knowledge theory</b>: consumers learn how persuasion works and use it when they sense someone is trying to change their mind. A “Sponsored” label makes us more critical and less trusting. This <b>media literacy</b> is a defense mechanism.</p><p><b>Disclosures and warnings</b> activate persuasion knowledge and increase resistance, but warnings can backfire by drawing attention to the product. In the NIH TV epilogue study, epilogues worked best for viewers who were both highly transported and high in persuasion knowledge.</p><p><b>Twist:</b> today consumers may simply look for a more credible source, or even admire a skilled persuader.</p>`]],work:'Match message to mindset: give engaged buyers proof and specs; give low-involvement shoppers a strong visual, a trusted face, and a simple cue.',lab:'elm'},
{id:'6.V',chapter:6,title:'Cialdini’s 6 weapons of influence',subtitle:'Reciprocity, scarcity, authority, consistency, liking & consensus',lead:'Robert Cialdini identifies six universal shortcuts that guide our decisions in an overloaded world. Used ethically, small, costless changes can make a big difference.',takeaway:'Reciprocity · Scarcity · Authority · Consistency · Liking · Consensus. Remember the studies: mints, Concorde, real estate intros, lawn signs, MBA negotiations, hotel towels.',blocks:[
['Why shortcuts?',`<p>People don’t weigh all the available information before deciding. In our overloaded lives we rely on <b>shortcuts (rules of thumb)</b>. Cialdini’s research found six universal ones. The textbook ties these to the slides’ “6 Weapons of Influence” and to <b>social proof</b> in 6.1.</p>`],
['1. Reciprocity: be first to give',`<p>People feel obliged to give back what they received first.</p><div class="table-wrap"><table><tr><th>Restaurant mint study</th><th>Tip increase</th></tr><tr><td>One mint with the bill</td><td>~3%</td></tr><tr><td>Two mints</td><td>~14% (quadrupled, not doubled)</td></tr><tr><td>One mint, waiter walks away, turns back: “for you nice people, here’s an extra mint”</td><td>~23%</td></tr></table></div><p><b>Key:</b> give first, and make it <b>personalized</b> and <b>unexpected</b>. It’s about <i>how</i> it’s given.</p>`],
['2. Scarcity: show what they’d lose',`<p>People want more of what they can have less of. When British Airways announced in 2003 it would end the London–New York Concorde flights, sales took off the next day. Nothing about the plane changed; it just became scarce.</p><p><b>Key:</b> tell people the benefits, plus what’s <b>unique</b> and what they <b>stand to lose</b>. Slides: scarcity is a negative-valence appeal (“limited edition,” FOMO).</p>`],
['3. Authority: signal credibility first',`<p>People follow credible, knowledgeable experts. Physiotherapists who displayed diplomas got more patients to do their exercises; people gave change to a stranger in a uniform.</p><p>You can’t brag yourself, but someone can introduce you, even someone who benefits. Real estate receptionists who said “Sandra has over 15 years’ experience…” got <b>20% more appointments</b> and <b>15% more signed contracts</b>, ethically and at no cost.</p>`],
['4. Consistency: start small',`<p>People like to be consistent with what they’ve said or done. Ask for small initial commitments. Homeowners who had displayed a small “Drive Safely” card 10 days earlier were <b>four times (400%)</b> as likely to agree to a big ugly lawn billboard.</p><p><b>Key:</b> look for <b>voluntary, active, public</b> commitments, ideally <b>in writing</b>. Having patients write their own appointment cards cut missed appointments by <b>18%</b>.</p>`],
['5. Liking: similarity, compliments, cooperation',`<p>We say yes to people we like. We like people who are <b>similar</b> to us, who <b>compliment</b> us, and who <b>cooperate</b> with us toward shared goals.</p><p>In MBA negotiations: “time is money, get straight to business” → ~55% reached agreement. “Exchange personal information and find a similarity first” → ~90% agreed, and deals were worth ~18% more to both sides.</p>`],
['6. Consensus: point to what others do',`<p>When uncertain, people look to others’ actions. Hotel towel cards:</p><div class="table-wrap"><table><tr><th>Message</th><th>Result</th></tr><tr><td>Environmental benefits</td><td>~35% compliance</td></tr><tr><td>“75% of our guests reuse their towels”</td><td>+26% reuse</td></tr><tr><td>“75% of people who stayed in <i>this room</i> reused their towel”</td><td>+33% reuse (most effective)</td></tr></table></div><p><b>Key:</b> point to what many <b>similar</b> others are already doing.</p>`]],work:'Before your next pitch, list one ethical move per principle: a helpful first gift, a real deadline, a credible introduction, a small first yes, a genuine similarity, and peer proof.',lab:'influence'},
{id:'6.4',chapter:6,title:'Crafting persuasive messages',subtitle:'Pictures vs. words, appeals & repetition',lead:'It’s not only what you say but how you say it. Format, wording, appeal type, and repetition all change how persuasive a message is.',takeaway:'Visual → emotion/aesthetics; verbal → utilitarian judgments; both = redundancy. Emotional appeals → fast persuasion; rational → slow. Repetition helps until boredom wins (two-factor theory).',blocks:[
['The 21st-century communications model',`<p>Figure 6.4: a <b>source</b> sends a <b>message</b> through a <b>medium</b> to consumers, who also talk to each other (consumer-to-consumer exchanges), and <b>feedback</b> returns to the source. Slides add <b>permission marketing</b>: you succeed more when you talk to consumers who agreed to listen.</p>`],
['Pictures or words?',`<ul><li><b>Visuals</b> work for emotional responses and fast/peripheral processing. They shape <b>aesthetic</b> evaluations.</li><li><b>Verbal</b> messages need more effort, suit System 2 settings like print, and shape <b>utilitarian</b> ratings. They decay faster, so they need more exposures.</li><li><b>Redundancy</b> (both, fitting together) works best. Yelp reviews with photos that matched the text were the most helpful.</li></ul>`],
['Beyond words',`<ul><li><b>Present tense</b> (“this textbook is great”) beats past tense; it sounds more confident (500,000+ reviews).</li><li><b>Resonance</b> = wordplay + a relevant picture (“berried treasure”). Metaphor substitutes one meaning for another; resonance uses a double meaning.</li><li><b>Sensory language</b> (“crumble,” “juicy”) makes influencers seem more authentic and trustworthy.</li><li><b>Mental stimulation:</b> getting people to imagine (“Imagine Where We Can Take You,” AR room planners) impacts behavior, especially when repeated with breaks.</li><li><b>Misspelled brand names</b> (Toys “R” Us, Mathnasium) make us think harder: memorable and likeable.</li><li><b>Voice numerosity:</b> multiple voices draw more attention. Across 11,000 crowdfunding videos, those with more voices raised more.</li></ul>`],
['Types of message appeals (Table 6.3)',`<p>Emotional appeals → affective processing → fast persuasion. Rational appeals → cognitive processing → slow persuasion.</p><div class="table-wrap"><table><tr><th>Rational</th><th>Valence</th><th>Emotional</th><th>Valence</th></tr><tr><td>Comparative</td><td>+/−</td><td>Family</td><td>+</td></tr><tr><td>Gain-framed</td><td>+</td><td>Youth</td><td>+</td></tr><tr><td>Two-sided</td><td>+/−</td><td>Status</td><td>+</td></tr><tr><td>Refutational (slides)</td><td>−</td><td>Adventure</td><td>+</td></tr><tr><td>Safety</td><td>+/−</td><td>Sex</td><td>+/−</td></tr><tr><td>Scarcity</td><td>−</td><td>Humor</td><td>+</td></tr><tr><td>Reciprocity</td><td>+</td><td>Fear</td><td>−</td></tr></table></div>`],
['Comparative, two-sided & refutational',`<p><b>Comparative advertising</b> names competing brands on specific attributes. The FTC encouraged it in 1971; many countries ban it. It can cause <b>source derogation</b> (doubting a biased source).</p><p><b>Supportive arguments</b> show only positives. <b>Two-sided messages</b> show both. <b>Refutational arguments</b> raise a negative, then dismiss it (GM: “Let’s be completely honest…”; Avis “No. 2”; VW “Lemon”). They boost credibility by reducing <b>reporting bias</b>. Two-sided works best with <b>well-educated</b> audiences who are <b>not already loyal</b>. Admit minor flaws only.</p>`],
['Sex, humor & fear',`<ul><li><b>Sex appeals</b> grab attention but can block processing; sexualized ads generated more negative attitudes in Italian research. They work when the product is sex-related (lingerie).</li><li><b>Humor</b> gets attention; effects on recall/attitude are mixed. It works by <b>distraction</b>, which blocks counterarguments. <b>Clever humor</b> (you solve the joke: VW “The Force,” Hinge “the dating app designed to be deleted”) persuades most. It backfires if misunderstood or offensive (Metamucil/Old Faithful).</li><li><b>Fear appeals</b> stress negative consequences. A <b>moderate threat</b> works best; too severe → people tune out. The “fear of God” backfires for believers. Most effective: include a <b>solution / coping response</b>.</li></ul>`],
['Should we repeat the message?',`<p><b>Mere exposure effect:</b> we like familiar things more, even names in negative news coverage. Too much repetition → <b>habituation</b> and <b>advertising wear-out</b>.</p><p><b>Two-factor theory</b>: repetition increases <b>familiarity</b> (positive learning factor) but also <b>boredom</b> (negative tedium factor). When boredom exceeds the benefit → wear-out.</p><p>“<b>Three’s the charm</b>” for product claims, but transporting ads with mental stimulation can go beyond three. Fight boredom with shorter formats (TikTok), spacing, and <b>variations on a theme</b>.</p>`]],work:'For a skeptical B2B buyer, try a two-sided message: admit a minor limitation, then show the major strength. It signals honesty and lowers counterarguing.',lab:'repetition'},
{id:'6.5',chapter:6,title:'Trust in the source & medium',subtitle:'Credibility, influencers, AI agents & advertainment',lead:'In an era of AI and misinformation, the messenger matters more than the message. Trust is the number-one factor in what makes a good source.',takeaway:'Source > message. Trust comes from reputation, then ethics and social responsibility. Smaller influencers feel more authentic. The most convincing source is other consumers.',blocks:[
['Trust is everything',`<p>A synthesis of 1,700+ ad studies (2.4 million participants) found the <b>source is more influential than the message</b>. A meta-analysis of 500+ studies over 50 years: a trusted source affects attitudes and behavior. The biggest ingredient for trust is <b>reputation</b>, then <b>perceived ethicality and social responsibility</b>.</p><p>The source must <b>fit</b> the message. Trust in science helps <b>utilitarian</b> products only.</p>`],
['Source credibility & misinformation',`<p><b>Source credibility</b> = a communicator’s <b>expertise, objectivity, or trustworthiness</b>. Things that hurt it:</p><ul><li><b>Superfast disclaimers:</b> fast speakers seem smart but less trustworthy.</li><li><b>Knowledge bias</b> (source’s knowledge is inaccurate) and <b>reporting bias</b> (knows the truth but won’t say it), from the slides.</li><li><b>Fake news:</b> hoaxes spread by hackers and others. Nearly two-thirds of Americans think mainstream media publish fake news; the U.S. ranked last in media trust among 46 countries.</li></ul><p>“I approve this message” endorsements made <b>policy attack ads</b> seem more credible. The <b>sleeper effect</b>: over time people forget a negative source and change attitudes anyway.</p><div class="callout"><strong>Persuasion amid misinformation</strong>Pair this with Ch 7’s <b>filter bubbles</b> and <b>echo chambers</b>, plus 6.3’s persuasion knowledge. Credible sources, accurate beliefs, and disclosure are your defenses.</div>`],
['Celebrity influencers',`<p>Influencer tiers: <b>nano</b> 1–10K followers, <b>micro</b> 10–100K, <b>macro</b> up to 1M, <b>celebrities</b> 1M+. About 20–25% of ads use celebrities.</p><p>A meta-analysis of 46 studies: celebrity endorsements do <b>not</b> raise awareness, ad attitude, or purchase intent, but they <b>do</b> increase liking of the product (and often the brand’s stock price).</p><p>Most effective when: <b>male</b> endorser, <b>actor</b> (not model/musician/host), <b>congruent</b> with the product, <b>implicit</b> endorsement (Sarah Jessica Parker “spotted” holding drink V), and a <b>new</b> product. Risks: scandals (Kevin Spacey, Ye) and poor fit (Mariah Carey + McDonald’s). <b>Collabs</b> link to the star’s real passion (Travis Scott meal, John Mayer × Audemars Piguet, Beyoncé × Adidas Ivy Park).</p>`],
['Social media influencers',`<p>Micro and nano influencers grow fastest because they have the <b>highest engagement</b>. They feel more similar, closer, and warmer → more <b>authentic</b> → more trusted. Posts mentioning close ties in first person (“my sister”) get more likes. Turning off comments makes influencers seem less sincere.</p><p><b>Social shopping</b> means buying directly on social platforms; the attitude-to-behavior gap closes in a few clicks. Benefit × Crocs with Manny MUA sold out the limited edition.</p>`],
['Nonhuman & AI sources',`<ul><li><b>Spokescharacters</b> (GEICO Gecko, Chester Cheetah, Pillsbury Doughboy) boost claim recall and brand attitudes, and they can’t misbehave.</li><li><b>Digital chatbots:</b> 38% of marketers call them the most impactful AI use, but consumers prefer humans. <b>Anthropomorphizing</b> a bot backfires when customers are angry.</li><li><b>Conversational AI</b> that takes turns, lets each side initiate, and grounds (acknowledges understanding) improves brand attitudes.</li><li>“<b>Bad news? Send an AI. Good news? Send a human.</b>”</li><li>We lose trust in algorithms fast when they make mistakes (ChatGPT hallucinations).</li></ul><p><b>Most convincing source of all: other consumers</b> (word of mouth, reviews).</p>`],
['The medium: advertainment',`<p><b>Advertainment</b> fuses advertising and entertainment, so it triggers fewer counterarguments.</p><div class="table-wrap"><table><tr><th>Form</th><th>Meaning</th><th>Example</th></tr><tr><td>Native advertising</td><td>Ads that blend into editorial content</td><td>Snapchat sunglass filter</td></tr><tr><td>Product placement</td><td>Real products inside movies, shows, videos</td><td>Eggo in <i>Stranger Things</i> (+14% sales)</td></tr><tr><td>Advergaming</td><td>Games merged with interactive ads</td><td>Chex Quest (+200% Chex sales)</td></tr><tr><td>Reality engineering</td><td>Pop culture becomes the promotional vehicle</td><td>Macy’s parade, <i>Barbie</i> movie, Hogwarts in Orlando</td></tr></table></div>`]],work:'In a trust-starved market, invest in reputation and genuine customer voices before paid reach. Choose smaller influencers whose real interests fit your product.',lab:'elm'},
{id:'7.1',chapter:7,title:'Fast or slow thinking?',subtitle:'System 1, System 2 & the mental budget',lead:'Every consumer decision is a response to a problem. Some get careful deliberation; most get a quick, automatic answer.',takeaway:'System 1 = fast, unconscious, automatic, everyday, error-prone. System 2 = slow, conscious, effortful, complex, reliable. Most consumer decisions happen in System 1.',blocks:[
['Two systems',`<div class="table-wrap"><table><tr><th>System 1 (fast)</th><th>System 2 (slow)</th></tr><tr><td>Unconscious</td><td>Conscious</td></tr><tr><td>Automatic</td><td>Effortful</td></tr><tr><td>Everyday decisions</td><td>Complex decisions</td></tr><tr><td>Error-prone</td><td>Reliable</td></tr></table></div><p>These are called <b>dual-process models</b> (Kahneman, <i>Thinking, Fast and Slow</i>). The <b>type of purchase</b> usually decides which system we use. Chan’s gaming PC (lots of money, attributes, options) → System 2. Paper towels → System 1. This parallels the central/peripheral routes from Chapter 6.</p>`],
['Why it matters to marketers',`<p>Marketers often assume customers are in System 2 mode, but <b>most consumer decisions actually happen in System 1</b>, when people ignore the flood of information. Know which mode your buyer is in before deciding what information to give them.</p><p>A <b>mental budget</b> lets us estimate future consumption to regulate the present: skipping a candy bar today because of tomorrow’s big BBQ.</p>`],
['Temperature changes how we decide',`<p>Holding a cold cup or sitting in a cold room → more <b>affect-based</b> decisions (they “warm us up”). Uncomfortably warm → more <b>rational</b>, “cooling” decisions. It’s the <b>thermoregulatory decision-making framework</b>.</p>`]],work:'Map your customer journey by system: where are buyers on autopilot (make the choice easy and familiar) and where are they deliberating (give comparison data)?',lab:'rules'},
{id:'7.2',chapter:7,title:'The rational decision process',subtitle:'Five steps, decision rules, choice overload & regret',lead:'When a decision matters, we move through problem recognition, search, evaluation, choice, and postpurchase evaluation, but each step has its own traps.',takeaway:'Problem → search → evaluate → choose → postpurchase evaluation. Moderate experts search most. Compensatory rules let strengths offset weaknesses; noncompensatory rules don’t. Too many choices backfire.',blocks:[
['Steps 1–2: problem recognition & information search',`<p><b>Problem recognition</b> = a significant gap between your current state and a desired state. Chan’s PC didn’t change; his <i>standard of comparison</i> did after seeing his friend’s setup.</p><p><b>Information search</b>: <b>prepurchase search</b> (for a specific need) vs. <b>ongoing search</b> (browsing for fun). Internal (memory) vs. external search. We search more when the purchase is important, when we need to learn, or when info is easy to get.</p><div class="callout"><strong>Who searches most? Moderately knowledgeable consumers</strong>It’s an <b>inverted-U</b> (Fig 7.3). Novices don’t feel competent and rely on others, brand, and price, processing top-down. Experts do <b>selective search</b>.</div><p><b>Filter bubbles</b>: algorithms serve what they think we want → <b>echo chambers</b> → misinformation risk. Caregiving study: making care look effortless can make caregivers feel worse.</p>`],
['Step 3: evaluate alternatives',`<p><b>Evoked set</b> = alternatives you know. <b>Consideration set</b> = ones you seriously consider. A rejected brand rarely gets back in, so make a good first impression.</p><p><b>Opportunity costs</b>: thinking about what you give up (Hawaii vs. Europe) makes the alternative seem more valuable.</p><p><b>Evaluative criteria</b> = dimensions used to judge options. <b>Determinant attributes</b> = the ones that actually differentiate. If all brands have great graphics cards, graphics stop deciding. Airbnb’s Attribute Prioritization System finds which amenities matter (hot tub for cabins, subway for city apartments).</p><p><b>Sequential</b> (one at a time) presentation → indecision and lower satisfaction. <b>Simultaneous</b> → easier trade-offs, more commitment.</p>`],
['Decision rules',`<div class="table-wrap"><table><tr><th>Rule</th><th>Type</th><th>How it works</th></tr><tr><td>Simple additive</td><td>Compensatory</td><td>Pick the option with the most positive attributes</td></tr><tr><td>Weighted additive</td><td>Compensatory</td><td>Weight each attribute by importance (like Fishbein)</td></tr><tr><td>Lexicographic</td><td>Noncompensatory</td><td>Best on most important attribute; tie → next attribute</td></tr><tr><td>Elimination-by-aspects</td><td>Noncompensatory</td><td>Like lexicographic but with specific cutoffs (“must have extra slots”)</td></tr><tr><td>Conjunctive</td><td>Noncompensatory</td><td>Processes by <b>brand</b>; must pass every cutoff</td></tr></table></div><p><b>Compensatory</b>: strength on one attribute can make up for weakness on another (systematic). <b>Noncompensatory</b>: fail one and you’re out (“never heard of it,” “that color is gross”). Typical for habitual/emotional choices. Chan used lexicographic: Optimus and Syop tied on CPU, so the graphics card decided it.</p><p><b>Low-calorie menu study:</b> grouping items into a “low-calorie” section made people choose them <i>less</i>.</p>`],
['Step 4: product choice & choice overload',`<p><b>Feature creep</b>: ever more features. Half of returned products work fine; buyers just couldn’t figure them out (gave up after about 20 minutes).</p><p><b>Choice overload / hyperchoice</b>: too many choices drain energy and worsen decisions. <b>Jam study:</b> 6 flavors → 30% bought; 24 flavors → 3% bought.</p><p><b>Paradox of choice</b>: we want more options, but too many cause problems. Fix: offer options but make deciding easier and educate consumers.</p>`],
['Step 5: postpurchase evaluation, regret & paralysis',`<p><b>Postpurchase evaluation</b> closes the loop: did it meet expectations? Feedback loops work: “Your Speed” signs cut speed about 10%.</p><p><b>Social scoring</b>: customers and providers rate each other (Uber, Airbnb, OpenTable), which shrinks the buyer–seller power gap.</p><p><b>Regret</b>: a forgone option now seems better. More likely when (1) the decision created big change, (2) it can’t be undone, (3) the outcome was negative. Regret lowers <b>repurchase</b> but doesn’t increase <b>complaints</b>.</p><p><b>Decision paralysis</b> (decision stress): choosing feels scary. We <b>delegate</b> difficult decisions (stockbrokers, designers) because we fear regret.</p>`]],work:'If customers stall at checkout, you may have a choice-overload problem. Curate fewer options, present them side by side, and highlight the determinant attribute.',lab:'rules'},
{id:'7.3',chapter:7,title:'Fast thinking & rules of thumb',subtitle:'Habits, behavioral biases, bounded rationality & mental accounting',lead:'We can’t run the full rational process for every purchase. Instead we rely on habits, heuristics, and “good enough” choices, which creates predictable biases.',takeaway:'Inertia ≠ loyalty. Satisficing (“good enough”) = bounded rationality. Mental accounting: money isn’t treated equally. Heuristics save effort but can mislead.',blocks:[
['Habitual decision making: inertia vs. loyalty',`<p><b>Habitual (fast) decision making</b> = choices with little conscious effort. It’s efficient (Gladwell’s <i>Blink</i>).</p><p><b>Inertia</b>: buying the familiar package because it takes less effort. It minimizes thinking and regret. <b>Brand loyalty</b>: a conscious decision to keep buying a brand you feel strongly about. Same behavior, different reasons.</p><div class="callout"><strong>The out-of-stock test</strong>If your brand is gone, do you grab another (inertia) or go elsewhere / wait (loyalty)?</div>`],
['Behavioral biases & behavioral economics',`<p><b>Homo economicus</b> = the fully rational decision maker with complete information. <b>Homo ludens</b> = “man the player”: the joyful, emotional side of consumption.</p><p><b>Behavioral biases</b> occur when preferences deviate from the <b>standard economic model</b>. <b>Behavioral economics</b> studies these <b>nonstandard beliefs</b>:</p><ul><li><b>Overconfidence</b> in our knowledge or abilities.</li><li><b>Law of small numbers:</b> ignoring base rates and sample sizes when estimating probabilities.</li><li>Slides add <b>statistical reasoning biases</b> (misusing statistics) and <b>affective forecasting biases</b> (forecasters’ predictions vs. experiencers’ evaluations).</li></ul><p><b>Bat-and-ball puzzle:</b> together $1.10, bat costs $1 more. Most say 10¢ (System 1); the answer is <b>5¢</b> (System 2). About one-fifth of Americans admit drunk shopping.</p>`],
['Bounded rationality: satisficing vs. maximizing',`<p>A <b>maximizing solution</b> seeks the best possible result. A <b>satisficing solution</b> settles for “good enough” with less effort. This perspective is <b>bounded rationality</b>: many decisions aren’t worth agonizing over. Paper towel buyers want something absorbent that won’t fall apart; they pick a familiar brand with a catchy tagline (“Bounty, the quicker picker-upper”), not the spec sheet.</p>`],
['Mental accounting',`<p><b>Mental accounting</b>: how we think about and use money depends on subjective factors like <b>how we got it</b> (job vs. inheritance) and <b>what form</b> it’s in (cash, credit, gift card, foreign currency).</p><p>Earn $1,000/week and save carefully, but spend a $1,000 inheritance on dinner for 20 friends. Inherited money gets spent faster; credit cards feel less like “real money.” It’s all the same money!</p>`],
['Heuristics (Table 7.2)',`<p><b>Heuristics</b> = mental rules of thumb, general (“higher price = higher quality”) or specific (“buy Domino sugar like Mom”).</p><div class="table-wrap"><table><tr><th>Heuristic</th><th>Choose based on…</th></tr><tr><td>Availability</td><td>Info most easily available to mind</td></tr><tr><td>Representativeness</td><td>Closest to the typical example of the category</td></tr><tr><td>Price</td><td>Price alone (higher = better)</td></tr><tr><td>Anchoring</td><td>The first information received</td></tr><tr><td>Variety-seeking</td><td>Something different from before</td></tr><tr><td>Risk aversion</td><td>The safest option</td></tr><tr><td>Familiarity</td><td>The most familiar option</td></tr><tr><td>Magnitude</td><td>How large the relationship with a hoped-for outcome seems</td></tr></table></div><p><b>Magnitude heuristic</b> example: “50% higher heart-disease risk with &lt;5 hours’ sleep” → people wrongly assume causation. A car shopper who knows two people with problems ignores a great repair record (availability).</p>`]],work:'Most buyers satisfice. Make your product the obvious “good enough” choice: familiar, easy to recognize, with one clear reason to pick it.',lab:'context'},
{id:'7.4',chapter:7,title:'Context effects',subtitle:'Framing, loss aversion, priming & nudging',lead:'Subtle features of the environment, the wording, and the default option shape choices, often without our awareness.',takeaway:'Framing: how a choice is posed. Loss aversion: losses hurt more than gains please. Priming: cues that activate a mindset. Nudge: deliberate change to the choice architecture.',blocks:[
['Context effects',`<p><b>Context effects</b> subtly shape how we think and decide:</p><ul><li>Products judged more harshly standing on tile vs. carpet.</li><li>Scented products → better memory for other attributes.</li><li>Cute products → more indulgence.</li><li>Being observed → no purchase or the default option.</li><li><b>Decoy option</b> (inferior to the others) → people upscale to the high-quality option.</li><li>Approaching a plate of curried grasshoppers improved attitudes toward them.</li></ul><p><b>Choice architecture</b>: changing how information is presented can sway choices.</p>`],
['Framing, loss aversion & prospect theory',`<p><b>Framing</b> = how the question is posed. <b>Loss aversion</b>: we hate losing more than we like gaining.</p><p><b>Prospect theory</b> analyzes how a decision’s value depends on gains or losses and how it’s communicated. Slides: in a <b>gain frame</b> people are <b>risk averse</b>; in a <b>loss frame</b> people are <b>risk seeking</b>. $100 feels big to someone poor and small to someone rich.</p><p><b>Sunk-cost fallacy</b>: paid tickets → more likely to drive into a dangerous snowstorm than free tickets, though the risk is identical. (Also: sitting through a bad movie you paid for.)</p>`],
['Priming',`<p>A <b>prime</b> is a cue that focuses people on some aspect of their lives without their awareness.</p><ul><li>Rubbing fur “against the flow” → choosing less popular products.</li><li>French music → more French wine sold; German music → more German wine. Shoppers had no idea.</li><li><b>Semantic frames</b>: calling it a <b>gift</b> instead of a donation raises giving.</li><li><b>Visual framing</b>: healthier ice cream flavors displayed on the <b>left</b> were chosen more (Hong Kong).</li><li><b>Temporal framing</b>: “End of August Sale” shifts attention <b>right</b>; “Start of September Sale” shifts it <b>left</b> (Fig 7.4).</li></ul>`],
['Nudging',`<p>A <b>nudge</b> is a deliberate change by an organization intended to modify behavior. Organizations create <b>nudge units</b> (UK’s Behavioural Insights Team, the “Ministry of Nudges”).</p><ul><li><b>Default bias</b>: it’s easier to comply than to opt out. Automatic retirement deductions, clean-energy defaults, opt-out free school meals (15 million children).</li><li><b>Urgency nudge</b>: “limited-time deal” (Amazon).</li></ul><p><b>Do nudges work?</b> Flu shot texts saying a vaccine was “reserved for you,” in a serious tone, raised vaccination about 5%. But a nudge may change the <i>choice</i>, not the <i>consumption</i>: 25% of downloaded apps are never used.</p><div class="callout"><strong>Prime vs. nudge</strong>A prime activates a mindset through cues. A nudge deliberately restructures the choice (defaults, opt-out, urgency).</div>`]],work:'Before redesigning a signup flow, test the default. Making the beneficial option the default respects freedom of choice while dramatically increasing uptake.',lab:'context'},
{id:'7.5',chapter:7,title:'Technology-assisted decisions',subtitle:'SEO, word-of-machine, reviews & cybermediaries',lead:'Search engines, social media, reviews, and AI now shape how we gather information. The problem is narrowing choices, not finding more.',takeaway:'Social search is rising. Trust AI for utilitarian decisions, humans for hedonic ones. Some negative reviews help. Binary bias: we see positive vs. negative, not 5 vs. 4.',blocks:[
['Search & SEO',`<p><b>Social search</b> (YouTube, Instagram) is growing: a quarter of adults mainly search on social media; 46% of Gen Z prefer it. Most of us only look at the top results.</p><p><b>Search engine optimization (SEO)</b> = designing content to show up in search. Algorithms weigh keywords and who shares the entry (influential sharers count more).</p>`],
['Word-of-machine',`<p><b>Word-of-mouth</b> = influence of others. <b>Word-of-machine</b> = trust in AI recommenders. We trust AI more for <b>utilitarian</b> decisions (CPU speed) and humans more for <b>hedonic</b> ones (which game will be fun). Chan should use ChatGPT for specs and friends for games.</p>`],
['Customer reviews',`<p>Online reviews are the <b>second-most trusted</b> source after friends and family (77% find them mostly trustworthy). But user ratings don’t link strongly to objective quality, and mobile reviews are more emotional and negative.</p><ul><li>All-glowing reviews seem suspicious; a few <b>irrelevant negative reviews</b> make us feel informed.</li><li><b>Binary bias</b>: we distinguish positive (4–5) from negative (1–2) but not 5 vs. 4, so we focus on the proportion positive.</li><li>Writing an <b>integrated</b> review (emotional + rational) helps you recover from a bad experience: 5–10× more likely to recommend the airline.</li></ul>`],
['Cybermediaries & AI assistants',`<p>A <b>cybermediary</b> filters and organizes online market information (Bizrate, Shopzilla, PriceGrabber, portals like The Knot, forums). <b>Digital selling assistants</b> (Alexa, Google Home) are sales platforms in our homes.</p><p>Conversational robo advisors earn more trust, and we follow their advice even when it doesn’t fit our risk profile. Effective service robots show intelligence, likability, safety, and social skills. Examples: The North Face + IBM Watson jacket finder, KFC China facial-recognition ordering, Levi’s AI models. Slides: <b>intelligent agents</b> use collaborative filtering; the <b>long tail</b> lets firms profit from many niche items.</p>`]],work:'Audit your digital shelf: Are you in the top results? Do you have enough reviews, including some honest critiques? Can an AI assistant accurately describe your product?',lab:'rules'}
];
const checkpointPrompts={
'6.1':['Alex says she loves a school near home but picks a distant one because her best friend is going there. Which model explains this, and how?','The Theory of Reasoned Action: her subjective norm (her friend’s strong normative belief × her high motivation to comply) outweighed her personal preference.'],
'6.2':['Using balance theory, why might a fan start to like a brand a favorite celebrity endorses?','Fan → celebrity (+) and celebrity → brand (+). To keep the triad balanced, fan → brand becomes positive.'],
'6.3':['Why is an attractive model a central cue in a shampoo ad but peripheral in a car ad?','For shampoo, attractiveness is the product’s actual benefit (message-relevant). For a car, it’s unrelated to the product’s merits, so it only influences low-involvement viewers.'],
'6.V':['Why did the “turn back with an extra mint” waiter earn the biggest tips?','Reciprocity works best when the gift is personalized and unexpected. The same mints, given differently, raised tips about 23%.'],
'6.4':['When is a two-sided message a better choice than a one-sided one?','When the audience is well educated, not already loyal, or skeptical. Admitting a minor flaw reduces reporting bias and raises credibility.'],
'6.5':['Why are micro and nano influencers growing faster than celebrities?','They have higher engagement and feel more similar, close, and warm, so they seem more authentic and trustworthy.'],
'7.1':['Why should a marketer care whether shoppers use System 1 or System 2?','It determines what information they’ll use. Most choices happen in System 1, where detailed specs get ignored and simple cues win.'],
'7.2':['Why did shoppers buy more jam with 6 flavors than with 24?','Choice overload: too many options drain energy and make the decision harder, so people give up (30% vs. 3% bought).'],
'7.3':['How can you tell inertia from brand loyalty?','Use the out-of-stock test. Inertia buyers switch to another brand; loyal buyers go elsewhere or wait for their brand.'],
'7.4':['Why would someone drive into a snowstorm for a paid ticket but not a free one?','Sunk-cost fallacy and loss aversion: having paid, skipping the game feels like a loss, even though the risk is identical.'],

const questions=[];
function Q(section,prompt,options,answer,why){questions.push({id:'q'+questions.length,section,prompt,options,answer,why});}
Q('6.1','Which best defines an attitude?',['A temporary emotional state','A lasting, general evaluation of people, objects, ads, or issues','A specific behavior a person engages in','An item a person dislikes'],1,'Attitudes are lasting (endure over time) and general (apply beyond one moment).');
Q('6.1','A consumer prefers fedoras because they signal old-fashioned sophistication. Which attitude function is this?',['Utilitarian','Value-expressive','Subjective norm','Mood congruency'],1,'The attitude expresses the person’s self-concept and values, not a practical benefit.');
Q('6.1','In the Fishbein model, the overall attitude score is calculated by…',['Adding importance weights only','Multiplying each belief by its importance weight and summing','Counting the attributes rated excellent','Averaging competitors’ ratings'],1,'A = Σ (belief × importance). In Table 6.1 Warren scores highest at 163.');
Q('6.1','Northland College promotes a new hands-on internship program to stand out. Which multiattribute strategy is this?',['Capitalize on relative advantage','Add a new attribute','Influence competitors’ ratings','Strengthen perceived linkages'],1,'Adding a feature competitors don’t offer distinguishes the brand.');
Q('6.1','Consumers rate the same product more favorably right after watching a funny show. This illustrates…',['Mood congruency','Attitudinal ambivalence','The sleeper effect','Balance theory'],0,'Moods shape judgments; positive moods produce more positive evaluations.');
Q('6.1','Alex’s parents strongly want her to stay near home, but she doesn’t care what they think. In the Theory of Reasoned Action, their influence is weak because…',['Normative belief is low','Motivation to comply is low','Her attitude is implicit','Importance weight is zero'],1,'Subjective norm = normative belief × motivation to comply. Low MC weakens the norm.');
Q('6.2','Why did the New Coke launch fail despite winning blind taste tests?',['The price was too high','Consumers held strong attitudes tied to identity and nostalgia','The ads used fear appeals','It was only tested at 4 stores'],1,'Strong attitudes linked to social identity are very hard to change.');
Q('6.2','Chris likes Dan (+), Dan likes earrings (+), Chris dislikes men’s earrings (−). The triad is…',['Balanced','Unbalanced','Neutral','Compensatory'],1,'Multiply the signs: + × + × − = negative, so the triad is unbalanced and creates tension.');
Q('6.2','Which change would NOT restore balance for Chris?',['Chris starts disliking Dan','Chris starts liking earrings','Chris decides Dan wore it for a fraternity initiation','Chris dislikes Dan AND starts liking earrings'],3,'Flipping two links gives − × + × + = negative, so it is still unbalanced. Flipping exactly one link (or disconnecting one) restores balance.');
Q('6.2','Students wear more school apparel after a big win. This is called…',['Mood congruency','Basking in reflected glory','Social desirability bias','The mere exposure effect'],1,'People identify with a winning image; the bigger the margin, the more apparel.');
Q('6.2','Attitudes formed through which process tend to be strongest and most durable?',['Emotional responses','Cognitive processes','Random exposure','Peripheral cues'],1,'Cognitively formed attitudes are held more strongly than emotionally formed ones.');
Q('6.3','According to the ELM, a highly involved consumer is most likely to…',['Focus on the package color','Take the central route and evaluate arguments','Rely on the celebrity endorser','Ignore the message'],1,'High involvement → central route → careful processing of the “steak.”');
Q('6.3','“When we don’t care much about a product, how it’s presented matters more.” This is the…',['Sleeper effect','Paradox of low involvement','Two-factor theory','Law of small numbers'],1,'Low involvement makes peripheral cues like packaging and endorsers more impactful.');
Q('6.3','Why do stories often persuade better than lectures?',['They contain more facts','Narrative transportation reduces counterarguing','They use comparative claims','They activate persuasion knowledge'],1,'Immersed viewers accept the story’s premise without generating counterarguments.');
Q('6.3','An Instagram post labeled “Sponsored” makes followers more skeptical. This reflects…',['Persuasion knowledge theory','Mood congruency','Basking in reflected glory','Default bias'],0,'Consumers draw on knowledge about persuasion attempts and become more critical.');
Q('6.3','In the ELM peripheral route, the sequence of change is…',['Cognitive responses → attitude → behavior','Belief change → behavior change → attitude change','Attitude → belief → behavior','Behavior → cognitive responses → attitude'],1,'Figure 6.3: in the peripheral route, attitude change comes after behavior change.');
Q('6.V','A waiter gives one mint, walks away, then returns with an extra mint “for you nice people.” Which principle, and why so effective?',['Scarcity: limited mints','Reciprocity: personalized and unexpected giving','Authority: the waiter’s uniform','Consensus: other diners'],1,'Reciprocity is strongest when you give first and make it personalized and unexpected (about 23% more tips).');
Q('6.V','Concorde sales jumped the day after British Airways announced the flights would end. Which principle?',['Liking','Consistency','Scarcity','Authority'],2,'Nothing about the product changed; it became scarce, so people wanted it more.');
Q('6.V','Receptionists mentioning colleagues’ years of experience increased appointments 20%. Which principle?',['Authority','Reciprocity','Liking','Consensus'],0,'Signaling credibility before the influence attempt; a third party can do it for you.');
Q('6.V','Homeowners who displayed a small “Drive Safely” card were 4× more likely to accept a large billboard. Which principle?',['Consensus','Consistency','Scarcity','Liking'],1,'A small voluntary, active, public commitment leads to bigger consistent behavior.');
Q('6.V','Negotiators who first found a similarity reached agreement about 90% of the time. Which principle?',['Authority','Liking','Reciprocity','Scarcity'],1,'We like (and say yes to) people similar to us.');
Q('6.V','Which hotel message produced the biggest towel reuse increase?',['Environmental protection benefits','75% of our guests reuse their towels','75% of guests who stayed in this room reused their towels','Please reuse your towels'],2,'Consensus works best when pointing to similar others: about 33% more reuse.');
Q('6.4','Which message format is best for a high-attention print context aimed at utilitarian evaluations?',['Visual only','Verbal','Neither','Music only'],1,'Verbal messages require more effort, suit System 2 settings, and affect utilitarian ratings.');
Q('6.4','An ad first admits a minor drawback, then dismisses it with a strength. This is a…',['Comparative appeal','Refutational argument','Fear appeal','Supportive argument'],1,'Refutational arguments raise a negative, then refute it, which increases credibility.');
Q('6.4','According to research, fear appeals work best when…',['The threat is extreme','The threat is moderate and a solution is offered','They are shown on religious programs','No coping response is given'],1,'Too severe a threat makes people tune out; offering a solution improves effectiveness.');
Q('6.4','The two-factor theory says repeated exposure…',['Always increases persuasion','Increases familiarity but also boredom, eventually causing wear-out','Has no effect','Only works for emotional appeals'],1,'Positive learning factor vs. negative tedium factor; when boredom exceeds benefit, wear-out occurs.');
Q('6.4','A funny ad increases acceptance mainly because it…',['Adds technical information','Distracts viewers from counterarguing','Is always remembered','Activates persuasion knowledge'],1,'Humor provides distraction that inhibits counterarguments.');
Q('6.4','Crowdfunding videos with multiple narrators raised more money. This is the…',['Mere exposure effect','Voice numerosity effect','Sleeper effect','Resonance effect'],1,'More voices trigger more attention and increase persuasion.');
Q('6.5','What is the most important factor that makes a source effective?',['Attractiveness','Trust','Popularity','Humor'],1,'Trust is the number-one factor; reputation is its biggest ingredient.');
Q('6.5','Over time, people forget a message came from a disliked source and change attitudes anyway. This is the…',['Halo effect','Sleeper effect','Binary bias','Mere exposure effect'],1,'The sleeper effect: differences between positive and negative sources diminish over time.');
Q('6.5','According to a meta-analysis, celebrity endorsements DO…',['Increase product awareness','Increase purchase intent','Make people like the product more','Improve attitudes toward the ad'],2,'They don’t raise awareness, ad attitude, or purchase intent, but they increase product liking.');
Q('6.5','A celebrity “spotted” holding a new drink on the street is more effective than in a commercial because the endorsement is…',['Explicit','Implicit','Comparative','Two-sided'],1,'Implicit endorsements of new products work better than explicit ones.');
Q('6.5','Placing Eggo waffles in Stranger Things is an example of…',['Native advertising','Product placement','Advergaming','Comparative advertising'],1,'Inserting real products into shows/movies; Eggo saw a 14% sales boost.');
Q('6.5','An angry customer encounters a very humanlike chatbot. Research predicts…',['Higher satisfaction','Even lower satisfaction','No difference','Increased loyalty'],1,'Anthropomorphizing chatbots backfires when consumers are angry.');
Q('7.1','Which describes System 1 decision making?',['Slow and effortful','Fast, automatic, and error-prone','Used mainly for complex decisions','Always reliable'],1,'System 1 is fast, unconscious, automatic, used for everyday decisions, and error-prone.');
Q('7.1','Chan researching a gaming PC with many attributes and a big budget most likely uses…',['System 1','System 2','Inertia','A noncompensatory habit'],1,'Complex, costly, multi-attribute decisions call for slow, deliberate System 2 processing.');
Q('7.1','The reality about most consumer decisions is that they happen in…',['System 2, with full information','System 1, ignoring much of the information marketers provide','Neither system','Only in stores'],1,'Marketers often assume System 2, but most decisions are made in System 1.');
Q('7.1','Skipping a candy bar today because you’ll eat a lot at tomorrow’s BBQ illustrates a…',['Mental budget','Sunk cost','Decoy option','Filter bubble'],0,'A mental budget estimates future consumption to regulate present behavior.');
Q('7.1','People feeling uncomfortably cold tend to make more…',['Rational decisions','Affect-based decisions','Delegated decisions','Satisficing decisions'],1,'The thermoregulatory framework: affective decisions “warm us up.”');
Q('7.2','Who tends to search the most for product information?',['Complete novices','Experts','Moderately knowledgeable consumers','Children'],2,'An inverted-U: moderate knowledge → most search. Experts search selectively.');
Q('7.2','The set of brands a consumer seriously considers is the…',['Evoked set','Consideration set','Determinant set','Choice architecture'],1,'Evoked set = known alternatives; consideration set = seriously considered ones.');
Q('7.2','All laptops a buyer considers have excellent batteries, so battery life stops mattering. The remaining features that differentiate are…',['Evaluative criteria','Determinant attributes','Heuristics','Opportunity costs'],1,'Determinant attributes are the features used to differentiate among choices.');
Q('7.2','A buyer picks the brand best on the most important attribute and breaks ties with the next attribute. This is the…',['Weighted additive rule','Lexicographic rule','Conjunctive rule','Simple additive rule'],1,'Chan used it: Optimus and Syop tied on CPU, so graphics decided.');
Q('7.2','A compensatory decision rule…',['Rejects any option that fails one criterion','Lets strength on one attribute make up for weakness on another','Is used for habitual decisions','Ignores attribute importance'],1,'Compensatory rules allow trade-offs; noncompensatory rules eliminate on any shortfall.');
Q('7.2','In the jam study, offering 24 flavors instead of 6…',['Doubled purchases','Dropped purchases from 30% to 3%','Had no effect','Increased satisfaction'],1,'Choice overload (hyperchoice) reduces the likelihood of buying.');
Q('7.2','Regret is MOST likely when the decision…',['Can easily be undone','Created little change','Created big change, can’t be undone, and had a negative outcome','Was delegated to an expert'],2,'Those three conditions make regret likelier; regret lowers repurchase but not complaints.');
Q('7.3','A shopper buys the same detergent only because it’s familiar and easy. This is…',['Brand loyalty','Inertia','Variety-seeking','Maximizing'],1,'Inertia takes less effort; loyalty is a conscious commitment to a brand.');
Q('7.3','Settling for a “good enough” paper towel rather than the best possible one reflects…',['Maximizing','Bounded rationality / satisficing','The sunk-cost fallacy','Homo economicus'],1,'Bounded rationality recognizes many decisions aren’t worth agonizing over.');
Q('7.3','Spending a $1,000 inheritance on a party while carefully saving $1,000 paychecks illustrates…',['Mental accounting','Anchoring','Social scoring','Default bias'],0,'How money was obtained changes how we treat it, even though it’s the same money.');
Q('7.3','Most people answer “10 cents” to the bat-and-ball puzzle. This shows…',['System 2 accuracy','System 1 speed and bias','Choice overload','Loss aversion'],1,'Fast System 1 thinking produces an intuitive but wrong answer; the ball costs 5¢.');
Q('7.3','Deciding a car is unreliable because two friends had problems with it, ignoring repair data, is closest to…',['Availability heuristic','Representativeness heuristic','Magnitude heuristic','Variety-seeking'],0,'The most easily recalled information drives the judgment.');
Q('7.3','Assuming a higher-priced option is higher quality is the…',['Familiarity heuristic','Price heuristic','Anchoring heuristic','Risk aversion heuristic'],1,'Selecting solely on price as a quality signal.');
Q('7.4','People hate losing more than they like gaining. This is…',['Loss aversion','Inertia','Priming','Binary bias'],0,'Loss aversion underlies many framing effects.');
Q('7.4','Fans who paid for tickets brave a dangerous snowstorm; those with free tickets stay home. This is the…',['Decoy effect','Sunk-cost fallacy','Default bias','Mere exposure effect'],1,'Having paid, people are reluctant to “waste” it, though the risk is identical.');
Q('7.4','French music in a wine store increased French wine sales without shoppers noticing. This is…',['Nudging','Priming','Framing a gain','Social scoring'],1,'Environmental cues activated a mindset outside awareness.');
Q('7.4','Employees are automatically enrolled in retirement savings and must opt out. This uses…',['Default bias','Loss framing','Temporal framing','The law of small numbers'],0,'People tend to stick with defaults; opt-out increases participation.');
Q('7.4','Adding a clearly inferior third option makes people choose the premium option more. The inferior option is a…',['Decoy option','Consideration set','Prime','Heuristic'],0,'A decoy leads people to upscale to the high-quality option.');
Q('7.4','According to prospect theory (slides), when a problem is framed as a loss, people tend to be…',['Risk averse','Risk seeking','Indifferent','Loyal'],1,'Gain frame → risk averse; loss frame → risk seeking.');

const quickNotes={
'6.1':['6.1 • Attitudes','Attitude = lasting, general evaluation of an attitude object. Functions: utilitarian vs. value-expressive. Cognitive (“I know it”) and affective (“I feel it”) parts. Fishbein: Σ belief × importance (Warren 163). Four marketing applications: relative advantage, strengthen linkages, add attribute, influence competitors. Mood vs. emotion; mood congruency. Gaps: ambivalence, implicit attitudes, social pressure. TRA adds subjective norm = NB × MC.'],
'6.2':['6.2 • Forming attitudes','Cognitive attitudes are stronger than emotional ones. Strong attitudes resist change (New Coke, Cracker Barrel). Table 6.2: accessibility, ambivalence, certainty, elaboration, importance, intensity, knowledge volume, vested interest. Balance theory: multiply signs; negative = unbalanced; change one link. Basking in reflected glory.'],
'6.3':['6.3 • Persuasion','ELM: high involvement → central (steak, arguments); low → peripheral (sizzle, cues). Paradox of low involvement. Same cue can be central or peripheral (model + shampoo vs. car). Narrative transportation lowers counterarguing. Persuasion knowledge and disclosures raise resistance.'],
'6.V':['Cialdini • 6 weapons','Reciprocity (mints: 3% → 14% → 23%; give first, personalized, unexpected). Scarcity (Concorde; show what they’ll lose). Authority (diplomas, uniforms, real estate +20% appointments). Consistency (small card → 4× billboard; voluntary, active, public, written; −18% missed appointments). Liking (similarity, compliments, cooperation; 55% → 90%). Consensus (towels: +26%, “this room” +33%).'],
'6.4':['6.4 • Messages','Visual = emotional/aesthetic; verbal = utilitarian; both = redundancy. Present tense, resonance, sensory language, mental stimulation, voice numerosity. Emotional appeals → fast; rational → slow. Two-sided/refutational boost credibility for educated, non-loyal audiences. Humor = distraction; clever humor best. Fear: moderate + solution. Mere exposure vs. two-factor wear-out; “three’s the charm.”'],
'6.5':['6.5 • Source & medium','Source > message. Trust = #1 (reputation, ethics). Credibility = expertise, objectivity, trustworthiness. Sleeper effect. Celebrities increase liking only; best if male, actor, congruent, implicit, new product. Micro/nano influencers = most engagement and authenticity. AI: bad news → AI, good news → human. Advertainment: native, placement, advergaming, reality engineering. Most convincing source: other consumers.'],
'7.1':['7.1 • Two systems','System 1: fast, unconscious, automatic, everyday, error-prone. System 2: slow, conscious, effortful, complex, reliable. Type of purchase decides. Most decisions are System 1. Mental budget. Cold → affective; warm → rational.'],
'7.2':['7.2 • Rational process','Problem recognition → information search → evaluation of alternatives → product choice → postpurchase evaluation. Inverted-U search. Evoked vs. consideration set. Determinant attributes. Compensatory (simple/weighted additive) vs. noncompensatory (lexicographic, elimination-by-aspects, conjunctive). Choice overload: jam 30% vs. 3%. Social scoring, regret, decision paralysis → delegate.'],
'7.3':['7.3 • Rules of thumb','Inertia vs. loyalty (out-of-stock test). Homo economicus vs. homo ludens. Behavioral biases; law of small numbers; bat-and-ball (5¢). Bounded rationality: satisfice vs. maximize. Mental accounting: inheritance vs. paycheck, credit isn’t “real money.” Heuristics: availability, representativeness, price, anchoring, variety-seeking, risk aversion, familiarity, magnitude.'],
'7.4':['7.4 • Context effects','Context effects (tile vs. carpet, decoy option). Framing; loss aversion; prospect theory (gain frame → risk averse; loss frame → risk seeking). Sunk-cost fallacy (paid ticket in snowstorm). Priming (wine music, fur, gift vs. donation, left placement, temporal framing). Nudges: default bias, opt-out, urgency. Nudges change choice, not always consumption.'],
'7.5':['7.5 • Technology','Social search rising; SEO. Word-of-machine: AI for utilitarian, humans for hedonic. Reviews: second-most trusted; some negatives help; binary bias. Cybermediaries; digital selling assistants; conversational robo advisors; intelligent agents and the long tail.']};
